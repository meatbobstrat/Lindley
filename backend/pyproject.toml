[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lindley"
version = "0.1.0"
description = "Turn scanned archives into searchable PDFs and chat with your documents."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.20",  # Add scans…: files uploaded from the app
    "pydantic>=2.8",
    "platformdirs>=4.0",
    "watchdog>=5.0",
    "pypdfium2>=4.30",
    "Pillow>=10.4",
    "fpdf2>=2.8,<3",  # searchable PDFs, written from Lindley's own readings
    "keyring>=25",
    # Each AI through its company's own library
    "anthropic>=1.11,<2",
    "openai>=3.24,<4",
    "google-genai>=2.28,<3",
    "httpx2>=2.13.1",  # downloading Lindley's own AI, when a person asks; and starting it
    # Lindley's icon in the tray. On Ubuntu it's the system's python3-pystray, which works with
    # its AppIndicators (through python3-gi): the .deb asks for both
    "pystray>=0.19.5; sys_platform != 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI's TestClient, and the Google connector's made-up server
    "httpx2>=2.13.1",  # the Anthropic and OpenAI connectors' made-up servers
]

[project.scripts]
lindley = "lindley.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# web: the built frontend, copied in by the installer (see app.FRONTEND_DIRS)
lindley = ["db/schema.sql", "icon.png", "web/**/*"]

# The installers, built with BeeWare's Briefcase (`briefcase package`), each on its own system
# by .github/workflows/installers.yml. Name, version, description and dependencies come from
# [project] above. Before `briefcase create`: the built frontend copied to src/lindley/web; on
# Windows, after it, Tesseract into the app's tesseract folder (see worker/ocr/tesseract.py).
[tool.briefcase]
project_name = "Lindley"
bundle = "io.github.meatbobstrat"
url = "https://github.com/meatbobstrat/Lindley"
author = "Bob Stratton"
author_email = "me@bobstratton.net"
# Here, not in [project]: the LICENSE is the repo's, a folder up, where packaging can't look
license = "LicenseRef-Lindley-Personal-Use-1.0"
license-files = ["../LICENSE"]

[tool.briefcase.app.lindley]
formal_name = "Lindley"
long_description = """Lindley is a research partner for working through thousands of scanned
pages: letters, deeds, receipts, diaries, books and manuscripts. Drop scans into a folder and
Lindley reads them, sorts the pages into documents, and turns each document into a searchable
PDF. You can also ask it questions about everything it has read. It runs on your own computer,
and opens in your web browser."""
sources = ["src/lindley"]
icon = "icons/lindley"  # drawn by scripts/make_icons.py
console_app = false  # no console window: the launcher opens the browser, and logs to a file

[tool.briefcase.app.lindley.macOS]
universal_build = false  # Apple processors (the CI runner's); Intel Macs aren't built yet

[tool.briefcase.app.lindley.linux.system.debian]
# Ubuntu 26.04's own: Tesseract with English and its orientation check; Vulkan and Mesa's
# drivers for Lindley's own AI (and OpenMP, which llama.cpp's build uses); the tray icon
system_runtime_requires = [
    "tesseract-ocr",
    "tesseract-ocr-eng",
    "tesseract-ocr-osd",
    "libvulkan1",
    "mesa-vulkan-drivers",
    "libgomp1",
    "python3-pystray",
    "python3-gi",
    "gir1.2-ayatanaappindicator3-0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
