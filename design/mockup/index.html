<meta charset="utf-8">
<title>Lindley Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Homemade+Apple&family=IM+Fell+English&family=Special+Elite&display=swap">
<style>
:root {
  --bg: #E3E7E1;
  --surface: #F7F8F5;
  --panel: #EDF0EA;
  --raise: #FFFFFF;
  --line: #D2D8D0;
  --line-strong: #B9C2B7;
  --ink: #1B2420;
  --muted: #56635C;
  --faint: #86918A;
  --accent: #2A4F86;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE5F3;
  --ai: #8A5A00;
  --ai-soft: #F6ECD6;
  --ok: #2F7A47;
  --ok-soft: #DCEFE2;
  --warn: #9A5606;
  --warn-soft: #F8E7CF;
  --stage: #D5DAD3;
  --shadow: 0 1px 2px rgba(20, 30, 25, .08), 0 8px 24px rgba(20, 30, 25, .10);
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1211; --surface: #161B19; --panel: #1A201E; --raise: #212825;
    --line: #2C3531; --line-strong: #3C4742; --ink: #E2E8E4; --muted: #9DA8A2; --faint: #6E7A74;
    --accent: #8FB1EA; --accent-ink: #0E1211; --accent-soft: #22314A;
    --ai: #E2B45E; --ai-soft: #36291A; --ok: #7FC794; --ok-soft: #1C3325;
    --warn: #E6A75C; --warn-soft: #3A2A16; --stage: #0F1312;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1211; --surface: #161B19; --panel: #1A201E; --raise: #212825;
  --line: #2C3531; --line-strong: #3C4742; --ink: #E2E8E4; --muted: #9DA8A2; --faint: #6E7A74;
  --accent: #8FB1EA; --accent-ink: #0E1211; --accent-soft: #22314A;
  --ai: #E2B45E; --ai-soft: #36291A; --ok: #7FC794; --ok-soft: #1C3325;
  --warn: #E6A75C; --warn-soft: #3A2A16; --stage: #0F1312;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 12px;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12px; }

/* ---------- App frame ---------- */
.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr) auto;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.top {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: .01em; min-width: 0; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.search { flex: 1; max-width: 520px; position: relative; }
.search input {
  width: 100%; padding: 7px 10px 7px 34px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--raise);
}
.search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.spacer { flex: 1; }
.sample { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line-strong); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--muted); }
.icon-btn:hover { background: var(--panel); color: var(--ink); }
.mobile-only { display: none; }

/* ---------- Tree ---------- */
.tree {
  grid-row: 2; grid-column: 1;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 10px 8px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
.t-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 6px 8px 6px calc(8px + var(--d, 0) * 16px);
  border: 1px solid transparent; border-radius: 6px; background: none; text-align: left;
}
.t-item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.t-item.is-active { background: var(--accent-soft); color: var(--ink); }
.t-item.is-active > .ic { color: var(--accent); }
.t-item.is-drop { border-color: var(--accent); border-style: dashed; background: var(--accent-soft); }
.t-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-item.is-temp .t-name { font-style: italic; }
.count { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.count.strong { font-weight: 600; color: var(--ink); background: var(--raise); border: 1px solid var(--line); padding: 0 7px; border-radius: 999px; }
.t-inbox { font-weight: 600; padding-block: 8px; }
.t-sec { margin-top: 10px; }
.t-sec-h {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 4px 8px; border: 0; background: none;
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.t-sec-h .chev { width: 14px; height: 14px; transition: transform .15s; }
.t-sec-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.t-list { display: flex; flex-direction: column; gap: 1px; }
.t-ready { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ok); background: var(--ok-soft); padding: 1px 6px; border-radius: 4px; }
.ic.ok { color: var(--ok); }
.t-add { display: flex; align-items: center; gap: 6px; margin: 4px 0 0 8px; padding: 4px 8px; border: 0; background: none; color: var(--muted); font-size: 13px; }
.t-add:hover { color: var(--accent); }
.t-add .ic { width: 15px; height: 15px; }
.legend { margin-top: auto; padding: 12px 8px 0; font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.legend i { font-family: var(--sans); }

/* ---------- Main ---------- */
.main { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 14px 20px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.crumbs { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title-in {
  flex: 1 1 280px; min-width: 0;
  font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.2;
  padding: 2px 6px; margin-left: -6px; border: 1px solid transparent; border-radius: 6px; background: none;
}
.title-in:hover:not([readonly]) { border-color: var(--line); }
.title-in:focus { border-color: var(--accent); background: var(--raise); outline: none; }
.title-in.is-temp { font-style: italic; }
h1.title { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.2; flex: 1 1 280px; text-wrap: balance; }
.sub { margin: 0 0 4px; color: var(--muted); max-width: 70ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 6px;
  border: 1px solid var(--line-strong); background: var(--raise); white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ai { border-color: color-mix(in srgb, var(--ai) 45%, transparent); color: var(--ai); background: var(--ai-soft); }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn .ic { width: 16px; height: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
.chip.ai { background: var(--ai-soft); border-color: transparent; color: var(--ai); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip .ic { width: 13px; height: 13px; }
.meter { display: inline-flex; align-items: center; gap: 6px; }
.meter b { display: inline-block; width: 54px; height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.meter b::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--m, var(--ok)); }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.banner > div { flex: 1 1 260px; }
.banner.ok { background: var(--ok-soft); }
.banner.ok > .ic { color: var(--ok); }
.banner.warn { background: var(--warn-soft); }
.banner.warn > .ic { color: var(--warn); }
.banner.ai { background: var(--ai-soft); }
.banner.ai > .ic { color: var(--ai); }
.banner .btn { padding: 4px 10px; font-size: 13px; }
.tabs { display: flex; gap: 2px; margin-top: 2px; overflow-x: auto; }
.tab { padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }

.tb { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.tb .btn { padding: 5px 9px; border-color: transparent; background: none; font-size: 13px; }
.tb .btn:hover:not(:disabled) { background: var(--panel); border-color: var(--line); color: var(--ink); }
.tb .btn.ai { color: var(--ai); }
.tb .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.tb-sel { font-size: 12px; color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; min-width: 9ch; }
.tb select, .tb input[type="range"] { font-size: 13px; }
.tb select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--raise); }
.tb label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

.scroll { flex: 1; overflow: auto; min-height: 0; }

/* Page grid */
.grid { --thumb: 150px; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--thumb), 1fr)); gap: 16px; padding: 18px 20px 28px; align-content: start; }
.pg { position: relative; display: flex; flex-direction: column; gap: 6px; border-radius: 8px; padding: 6px; border: 2px solid transparent; user-select: none; }
.pg:hover { background: var(--panel); }
.pg.is-sel { border-color: var(--accent); background: var(--accent-soft); }
.pg.drop-before { box-shadow: -6px 0 0 -2px var(--accent); }
.pg.drop-after { box-shadow: 6px 0 0 -2px var(--accent); }
.pg.is-dragging { opacity: .4; }
.pg-img { aspect-ratio: 3 / 4; display: grid; place-items: center; overflow: hidden; border-radius: 3px; background: var(--stage); }
.pg-img img, .rot { transform: rotate(var(--r, 0deg)) scale(var(--s, 1)); transition: transform .25s ease; }
.pg-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pg-check {
  position: absolute; top: 12px; left: 12px; width: 22px; height: 22px; border-radius: 5px;
  display: grid; place-items: center; background: var(--raise); border: 1px solid var(--line-strong); opacity: 0; color: var(--accent-ink);
}
.pg:hover .pg-check, .pg.is-sel .pg-check { opacity: 1; }
.pg.is-sel .pg-check { background: var(--accent); border-color: var(--accent); }
.pg-check .ic { width: 14px; height: 14px; stroke-width: 2.4; }
.pg-f { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; }
.pg-lbl { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-lbl.mono { font-weight: 400; color: var(--muted); }
.conf { font-size: 11px; padding: 0 6px; border-radius: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.conf.hi { color: var(--ok); background: var(--ok-soft); }
.conf.mid { color: var(--warn); background: var(--warn-soft); }
.conf.lo { color: var(--ai); background: var(--ai-soft); }
.conf.reading { color: var(--muted); background: var(--panel); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.pg-flag { position: absolute; top: 12px; right: 12px; font-size: 11px; background: var(--warn-soft); color: var(--warn); padding: 1px 6px; border-radius: 4px; }
.pg-hint {
  display: flex; align-items: center; gap: 4px; width: 100%;
  padding: 3px 6px; border-radius: 5px; border: 1px dashed color-mix(in srgb, var(--ai) 50%, transparent);
  background: var(--ai-soft); color: var(--ai); font-size: 11.5px; text-align: left;
}
.pg-hint span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-hint .ic { width: 13px; height: 13px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }

/* Reader */
.reader { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
.rd-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rd-stage { overflow: auto; background: var(--stage); display: grid; place-items: center; padding: 24px; }
.rd-stage img { width: calc(var(--z) * min(560px, 100%)); max-width: none; box-shadow: var(--shadow); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px; border-top: 1px solid var(--line); }
.strip button { flex: none; width: 58px; padding: 2px; border: 2px solid transparent; border-radius: 4px; background: none; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip .pg-img img { transition: none; }
.strip span { display: block; font-size: 11px; color: var(--muted); }

/* Side by side */
.side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }
.side-img { background: var(--stage); overflow: auto; display: grid; place-items: center; padding: 20px; }
.side-img img { max-height: 100%; max-width: 100%; box-shadow: var(--shadow); }
.side-tx { overflow: auto; padding: 16px 22px 24px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--line); }
.side-h { display: flex; align-items: center; gap: 8px; }
.side-h strong { flex: 1; }
.engine { font-size: 12px; color: var(--muted); }
.tx {
  font-family: var(--serif); font-size: 16.5px; line-height: 1.6; white-space: pre-wrap; max-width: 62ch;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); min-height: 200px;
}
.tx:focus { outline: none; border-color: var(--accent); }
.tx mark { background: var(--ai-soft); color: inherit; border-bottom: 2px dotted var(--ai); padding: 0 1px; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; max-width: 62ch; }

/* Details */
.details { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; padding: 20px; align-items: start; }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 4px; }
.field > label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.field input, .field select, .field textarea { padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--raise); width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }
.field input:disabled, .field textarea:disabled, .field select:disabled { opacity: .7; }
.sugg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ai); }
.sugg .ic { width: 14px; height: 14px; }
.sugg button { padding: 1px 8px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--ai) 40%, transparent); background: var(--ai-soft); color: var(--ai); font-size: 12px; }
.sugg button.no { border-color: transparent; background: none; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tags .chip button { border: 0; background: none; padding: 0; color: var(--muted); line-height: 1; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--raise); display: grid; gap: 8px; }
.card h3 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
.card p { margin: 0; font-size: 13px; color: var(--muted); }
.card.ai h3 { color: var(--ai); display: flex; align-items: center; gap: 6px; }

/* Folder / doc cards */
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 20px; }
.dcard { display: flex; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); text-align: left; align-items: flex-start; }
.dcard:hover { border-color: var(--accent); }
.dcard .pg-img { width: 64px; flex: none; }
.dcard b { display: block; font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1.25; margin-bottom: 4px; }
.dcard small { color: var(--muted); display: block; }

/* Search */
.results { display: grid; gap: 4px; padding: 12px 20px 24px; max-width: 900px; }
.res { display: flex; gap: 14px; padding: 10px; border: 1px solid transparent; border-radius: 8px; background: none; text-align: left; align-items: flex-start; }
.res:hover { background: var(--panel); border-color: var(--line); }
.res .pg-img { width: 56px; flex: none; }
.res b { font-weight: 600; }
.res p { margin: 4px 0 0; font-family: var(--serif); font-size: 15px; color: var(--muted); }
.res mark { background: var(--accent-soft); color: var(--ink); padding: 0 2px; border-radius: 2px; }

/* Status bar */
.status {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 5px 12px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); background: var(--panel);
}
.status .ic { width: 14px; height: 14px; }
.status span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.dot.busy { background: var(--ai); animation: pulse 1.2s infinite; }

/* ---------- Ask Lindley ---------- */
.ai-pane {
  grid-row: 2; grid-column: 3; width: 340px;
  display: flex; flex-direction: column; min-height: 0;
  border-left: 1px solid var(--line); background: var(--raise);
}
.ai-pane.is-float {
  position: absolute; z-index: 30; width: 360px; height: 480px;
  border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow);
  resize: both; overflow: hidden; min-width: 280px; min-height: 300px;
}
.ai-h { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); }
.ai-pane.is-float .ai-h { cursor: move; background: var(--panel); }
.ai-h strong { flex: 1; font-family: var(--serif); font-size: 16px; }
.ai-h > .ic { color: var(--ai); }
.ai-h .icon-btn { width: 28px; height: 28px; }
.ai-ctx { padding: 6px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface); }
.ai-ctx b { color: var(--ink); font-weight: 500; }
.ai-log { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; font-size: 13.5px; }
.msg p { margin: 0 0 6px; }
.msg p:last-child { margin: 0; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
.msg.ai { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 3px; }
.msg ul { margin: 4px 0; padding-left: 18px; display: grid; gap: 3px; }
.msg q { font-family: var(--serif); font-style: italic; }
.msg-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg-acts button { font-size: 12px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--raise); }
.msg-acts button:hover { border-color: var(--accent); color: var(--accent); }

/* ================= Page images (canvas) ================= */
const PW = 600, PH = 800;
const IMG = new Map();
const imgKey = s => s.id + ':' + hash(s.text);
function pageImg(id) {
  const s = D.scans[id];
  const k = imgKey(s);
  if (!IMG.has(k)) IMG.set(k, drawPage(s));
  return IMG.get(k);
}
function wrap(g, text, maxW) {
  const out = [];
  text.split('\n').forEach(p => {
    if (!p.trim()) { out.push(''); return; }
    let line = '';
    p.split(' ').forEach(w => {
      const t = line ? line + ' ' + w : w;
      if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    });
    out.push(line);
  });
  return out;
}
function drawPage(s) {
  const c = document.createElement('canvas');
  c.width = PW; c.height = PH;
  const g = c.getContext('2d');
  const r = rng(hash(s.id));
  const text = s.text.replace(/[{}]/g, '');
  g.fillStyle = '#d6d7d1';
  g.fillRect(0, 0, PW, PH);
  g.save();
  if (s.kind === 'receipt' || s.kind === 'note') {
    const note = s.kind === 'note';
    const w = note ? 360 : 330, h = note ? 360 : 600;
    g.translate(PW / 2, PH / 2); g.rotate((r() - .5) * .06); g.translate(-w / 2, -h / 2);
    g.shadowColor = 'rgba(0,0,0,.18)'; g.shadowBlur = 8;
    g.fillStyle = note ? '#f1d869' : '#f5f1e6';
    g.fillRect(0, 0, w, h);
    g.shadowBlur = 0;
    if (note) {
      g.fillStyle = '#28408a'; g.font = '24px "Homemade Apple", cursive';
      wrap(g, text, w - 60).forEach((l, i) => g.fillText(l, 30, 80 + i * 44));
    } else {
      g.fillStyle = '#3b3b3b'; g.font = '14px "IBM Plex Mono", monospace';
      wrap(g, text, w - 40).forEach((l, i) => g.fillText(l, 20, 40 + i * 24));
    }
    g.restore();
    return c.toDataURL('image/jpeg', .84);
  }
  g.translate(PW / 2, PH / 2); g.rotate((r() - .5) * .02); g.translate(-PW / 2, -PH / 2);
  const papers = s.kind === 'typed' ? ['#f3f0e6', '#efebdf'] : ['#efe4cc', '#ece2cd', '#f1eadb', '#e5d9bf'];
  g.fillStyle = papers[Math.floor(r() * papers.length)];
  g.fillRect(16, 14, PW - 32, PH - 28);
  const vg = g.createRadialGradient(PW / 2, PH / 2, PH * .25, PW / 2, PH / 2, PH * .75);
  vg.addColorStop(0, 'rgba(120,90,40,0)'); vg.addColorStop(1, 'rgba(120,90,40,.2)');
  g.fillStyle = vg; g.fillRect(16, 14, PW - 32, PH - 28);
  const spots = 6 + Math.floor(r() * 12);
  for (let i = 0; i < spots; i++) {
    const x = 30 + r() * (PW - 60), y = 30 + r() * (PH - 60), rad = 2 + r() * 9;
    const fg = g.createRadialGradient(x, y, 0, x, y, rad);
    fg.addColorStop(0, `rgba(140,95,45,${.1 + r() * .22})`); fg.addColorStop(1, 'rgba(140,95,45,0)');
    g.fillStyle = fg; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
  }
  if (s.kind === 'hand' && r() < .6) { g.fillStyle = 'rgba(90,70,40,.1)'; g.fillRect(16, PH / 2 + (r() - .5) * 30, PW - 32, 2); }

  if (s.kind === 'hand') {
    g.fillStyle = r() < .5 ? '#3b2d20' : '#26304a';
    g.font = '21px "Homemade Apple", cursive';
    const paras = text.split('\n');
    let y = 104;
    paras.forEach((p, pi) => {
      if (!p.trim()) { y += 16; return; }
      const right = pi < 2 && p.length < 34 && !/^(Dear|Friend|My)/.test(p) && paras.length > 3;
      wrap(g, p, PW - 130).forEach(l => {
        if (y > PH - 50) return;
        const w = g.measureText(l).width;
        const x = right ? PW - 70 - w : 66;
        g.save(); g.translate(x + (r() - .5) * 5, y + (r() - .5) * 3); g.rotate((r() - .5) * .014);
        g.fillText(l, 0, 0); g.restore();
        y += 39;
      });
    });
  } else if (s.kind === 'print') {
    g.fillStyle = '#211d18';
    const paras = text.split('\n');
    let y = 92;
    if (/CERTIFICATE|RECEIPT|BANK/.test(paras[0])) {
      g.strokeStyle = 'rgba(40,30,20,.55)'; g.lineWidth = 3; g.strokeRect(34, 32, PW - 68, PH - 64);
      g.lineWidth = 1; g.strokeRect(42, 40, PW - 84, PH - 80);
    }
    paras.forEach((p, pi) => {
      if (!p.trim()) { y += 12; return; }
      const title = pi === 0 && p === p.toUpperCase();
      g.font = title ? '30px "IM Fell English", serif' : '18px "IM Fell English", serif';
      wrap(g, p, PW - 140).forEach(l => {
        if (y > PH - 56) return;
        const x = title ? (PW - g.measureText(l).width) / 2 : 70;
        g.fillText(l, x, y);
        y += title ? 44 : 27;
      });
    });
  } else if (s.kind === 'typed') {
    g.font = '16px "Special Elite", "Courier New", monospace';
    let y = 90;
    text.split('\n').forEach(p => {
      if (!p.trim()) { y += 14; return; }
      const center = p === p.toUpperCase() || /^Chapter|^- \d+ -$/.test(p);
      wrap(g, p, PW - 150).forEach(l => {
        if (y > PH - 50) return;
        g.fillStyle = `rgba(30,30,30,${.72 + r() * .25})`;
        g.fillText(l, center ? (PW - g.measureText(l).width) / 2 : 76, /^- \d+ -$/.test(p) ? PH - 60 : y);
        y += 30;
      });
    });
  } else if (s.kind === 'blank') {
    g.globalAlpha = .07; g.fillStyle = '#3b2d20'; g.font = '19px "Homemade Apple", cursive';
    g.translate(PW, 0); g.scale(-1, 1);
    SENT.slice(0, 12).forEach((l, i) => g.fillText(l.slice(0, 40), 66, 100 + i * 40));
  }
  g.restore();
  return c.toDataURL('image/jpeg', .82);
}
const angle = s => (s.orient + s.rot + 360) % 360;
const rotStyle = s => { const a = angle(s); return `--r:${a}deg;--s:${a % 180 ? .75 : 1}`; };

/* ================= Model helpers ================= */
const docsBy = st => Object.values(D.docs).filter(d => d.status === st);
const curDoc = () => U.nav.t === 'doc' ? D.docs[U.nav.id] : null;
function listIds() {
  if (U.nav.t === 'inbox') return D.inbox;
  if (U.nav.t === 'aside') return D.aside;
  const d = curDoc();
  return d ? d.pages : [];
}
function sortedInbox() {
  const a = [...D.inbox];
  if (U.sort === 'new') a.sort((x, y) => D.scans[y].scanned.localeCompare(D.scans[x].scanned));
  if (U.sort === 'old') a.sort((x, y) => D.scans[x].scanned.localeCompare(D.scans[y].scanned));
  if (U.sort === 'match') a.sort((x, y) => (!!D.scans[y].hint) - (!!D.scans[x].hint));
  return a;
}
function locate(id) {
  if (D.inbox.includes(id)) return { where: 'inbox', arr: D.inbox };
  if (D.aside.includes(id)) return { where: 'aside', arr: D.aside };
  for (const d of Object.values(D.docs)) if (d.pages.includes(id)) return { where: 'doc', doc: d, arr: d.pages };
  return null;
}
function detach(id) {
  const l = locate(id);
  if (!l) return null;
  l.arr.splice(l.arr.indexOf(id), 1);
  return l;
}
function folderOf(docId) { return Object.values(D.folders).find(f => f.docs.includes(docId)); }
function dropEmptyDocs(touched) {
  const removed = [];
  touched.forEach(d => {
    if (d && D.docs[d.id] && !d.pages.length) {
      delete D.docs[d.id];
      Object.values(D.folders).forEach(f => { f.docs = f.docs.filter(x => x !== d.id); });
      removed.push(d.name);
      if (U.nav.t === 'doc' && U.nav.id === d.id) U.nav = { t: 'inbox' };
    }
  });
  return removed;
}
function targets() {
  const list = listIds();
  if (U.nav.t === 'doc' && (U.view === 'reader' || U.view === 'side')) return list[U.cur] ? [list[U.cur]] : [];
  return list.filter(id => U.sel.has(id));
}
function shortName(n) { return n.length > 26 ? n.slice(0, 25) + '…' : n; }

/* ================= History / undo ================= */
function commit(label, fn) {
  H.push(JSON.stringify(D));
  if (H.length > 60) H.shift();
  const extra = fn();
  render();
  toast(extra ? `${label} ${extra}` : label, true);
}
function undo() {
  if (!H.length) { toast('Nothing to undo'); return; }
  D = JSON.parse(H.pop());
  if (U.nav.t === 'doc' && !D.docs[U.nav.id]) U.nav = { t: 'inbox' };
  U.sel.clear();
  clampCur();
  render();
  toast('Undone');
}
function clampCur() { const n = listIds().length; U.cur = Math.max(0, Math.min(U.cur, n - 1)); }

/* ================= Actions ================= */
function rotate(ids, deg) {
  if (!ids.length) return;
  commit(`Rotated ${plural(ids.length, 'page')}.`, () => ids.forEach(id => { D.scans[id].rot = (D.scans[id].rot + deg + 360) % 360; }));
}
function shift(ids, dir) {
  const arr = listIds();
  if (!ids.length) return;
  commit(`Moved ${plural(ids.length, 'page')} ${dir < 0 ? 'earlier' : 'later'}.`, () => {
    const idx = ids.map(id => arr.indexOf(id)).sort((a, b) => dir < 0 ? a - b : b - a);
    idx.forEach(i => {
      const j = i + dir;
      if (j < 0 || j >= arr.length || ids.includes(arr[j])) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
    });
    if (U.view === 'reader' || U.view === 'side') U.cur = arr.indexOf(ids[0]);
  });
}
function moveTo(ids, docId) {
  if (!ids.length) return;
  let target = D.docs[docId];
  const label = target ? `Moved ${plural(ids.length, 'page')} to “${shortName(target.name)}”.` : `Started a new document with ${plural(ids.length, 'page')}.`;
  commit(label, () => {
    if (!target) {
      const id = 'd' + D.nextDoc++;
      D.docs[id] = { id, name: `Untitled document ${D.nextDoc - 6}`, temp: true, status: 'progress', conf: 50, pages: [], type: '', date: '', people: '', place: '', tags: [], notes: '', ready: false, dismissed: [], note: null, why: ['You grouped these pages yourself'], suggest: {}, summary: 'You started this document by hand. Lindley will suggest a name and date once it has read the pages together.' };
      target = D.docs[id];
    }
    const touched = ids.map(id => detach(id)).filter(l => l && l.doc).map(l => l.doc);
    ids.forEach(id => { target.pages.push(id); D.scans[id].hint = null; });
    U.sel.clear();
    const removed = dropEmptyDocs(touched);
    if (!D.docs[docId]) U.nav = { t: 'doc', id: target.id }, U.view = 'grid';
    clampCur();
    return removed.length ? `The empty document “${shortName(removed[0])}” was removed.` : '';
  });
}
function toInbox(ids) {
  if (!ids.length) return;
  commit(`Returned ${plural(ids.length, 'page')} to the Inbox. Lindley will read and sort ${ids.length === 1 ? 'it' : 'them'} again.`, () => {
    const touched = ids.map(id => detach(id)).filter(l => l && l.doc).map(l => l.doc);
    ids.forEach(id => { D.inbox.unshift(id); Object.assign(D.scans[id], { hint: null, status: 'reading', scanned: new Date().toISOString().slice(0, 16) }); });
    U.sel.clear();
    const removed = dropEmptyDocs(touched);
    clampCur();
    return removed.length ? `The empty document “${shortName(removed[0])}” was removed.` : '';
  });
}
function setAside(ids) {
  if (!ids.length) return;
  commit(`Set aside ${plural(ids.length, 'scan')}. Nothing was deleted.`, () => {
    const touched = ids.map(id => detach(id)).filter(l => l && l.doc).map(l => l.doc);
    ids.forEach(id => { D.aside.unshift(id); D.scans[id].hint = null; });
    U.sel.clear();
    dropEmptyDocs(touched);
    clampCur();
  });
}
function reorderDrop(dragIds, targetId, after) {
  const d = curDoc();
  if (!d || dragIds.includes(targetId)) return;
  commit(`Moved ${plural(dragIds.length, 'page')}.`, () => {
    const moving = d.pages.filter(p => dragIds.includes(p));
    const rest = d.pages.filter(p => !dragIds.includes(p));
    rest.splice(rest.indexOf(targetId) + (after ? 1 : 0), 0, ...moving);
    d.pages = rest;
  });
}
function exportDoc(id) {
  const d = D.docs[id];
  commit(`Exported “${shortName(d.name)}” as a searchable PDF and moved it to Completed.`, () => {
    d.status = 'complete'; d.temp = false; d.ready = false;
    d.exported = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  });
}
function reopen(id) {
  const d = D.docs[id];
  commit(`Reopened “${shortName(d.name)}”. The exported PDF is kept until you export again.`, () => { d.status = 'progress'; });
}
function setField(id, field, value, label) {
  const d = D.docs[id];
  if (d[field] === value) return;
  commit(label || 'Saved.', () => { d[field] = value; if (field === 'name') d.temp = false; });
}

function viewReader(d) {

  return `<div class="reader" style="min-height:0;flex:1">

  return `<div class="side" style="flex:1;min-height:0">

      <div class="tx" id="tx" ${done ? '' : 'contenteditable="true"'} spellcheck="false" aria-label="Transcription of page ${U.cur + 1}">${tx}</div>
      ${unsure ? `<p class="note">Lindley highlighted ${plural(unsure, 'word')} it wasn't sure of. Click into the text to correct ${unsure === 1 ? 'it' : 'them'}.</p>` : '<p class="note">Click into the text to correct it. Your corrections are used for search and chat.</p>'}

}
function viewDetails(d, done) {

  const pending = Object.keys(d.suggest).filter(f => sugg(f)).length;
  const types = ['', 'Letter', 'Deed', 'Diary', 'Manuscript', 'Certificate', 'Receipt', 'Photograph', 'Other'];
  return `<div class="details">
    <div class="form">

      <div class="field"><label for="det-type">Kind of document</label><select id="det-type" data-field="type" ${dis}>${types.map(t => `<option ${d.type === t ? 'selected' : ''} value="${t}">${t || 'Not set'}</option>`).join('')}</select>${sugg('type')}</div>
      <div class="field"><label for="det-date">Date written</label><input id="det-date" data-field="date" value="${esc(d.date)}" placeholder="For example 14 March 1892, or 1890s" ${dis}>${sugg('date')}</div>
      <div class="field"><label for="det-people">People</label><input id="det-people" data-field="people" value="${esc(d.people)}" placeholder="Who wrote it, who it's to, who is named" ${dis}>${sugg('people')}</div>
      <div class="field"><label for="det-place">Place</label><input id="det-place" data-field="place" value="${esc(d.place)}" ${dis}>${sugg('place')}</div>
      <div class="field"><label for="det-tag">Tags</label>
        <div class="tags">${d.tags.map(t => `<span class="chip">${esc(t)}${done ? '' : `<button data-untag="${esc(t)}" aria-label="Remove tag ${esc(t)}">×</button>`}</span>`).join('')}
        ${done ? '' : '<input id="det-tag" placeholder="Add a tag and press Enter" style="flex:1;min-width:160px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--raise)">'}</div></div>
      <div class="field"><label for="det-notes">Notes</label><textarea id="det-notes" data-field="notes" placeholder="Anything you want to remember about this document" ${dis}>${esc(d.notes)}</textarea></div>
    </div>
    <div class="form">
      <div class="card ai"><h3>${icon('spark')} Lindley's summary</h3><p>${esc(d.summary || '')}</p></div>
      ${d.why.length ? `<div class="card"><h3>Why these pages are together</h3><ul>${d.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
      <div class="card"><h3>${done ? 'Exported PDF' : 'When you finish'}</h3>
        <p>${done ? `Exported ${esc(d.exported || '')}. Reopen the document to change it and export a new copy.` : `Lindley combines the ${plural(d.pages.length, 'page')} in this order into one searchable PDF, with the details above saved inside it, and moves the document to Completed. You can reopen it later.`}</p>
        <div class="actions">${done ? '<button class="btn" data-act="reopen">Reopen for changes</button>' : `<button class="btn primary" data-act="export">${icon('pdf')} Finish and export PDF</button>`}</div></div>
    </div>
  </div>`;
}
function viewFolder() {

    ${docs.map(d => `<button class="dcard" data-nav="doc:${d.id}"><div class="pg-img"><img src="${pageImg(d.pages[0])}" alt="" style="${rotStyle(D.scans[d.pages[0]])}"></div><div><b style="${d.temp ? 'font-style:italic' : ''}">${esc(d.name)}</b><small>${plural(d.pages.length, 'page')} · ${d.status === 'complete' ? 'Completed' : 'In progress'}</small>${d.date ? `<small>${esc(d.date)}</small>` : ''}</div></button>`).join('')}
    ${!docs.length && !kids.length ? '<div class="empty">This folder is empty. Drag documents here from the list on the left.</div>' : ''}

function searchScans(q) {
  const ql = q.toLowerCase();
  const out = [];
  Object.values(D.scans).forEach(s => {
    const t = s.text.replace(/[{}]/g, '');
    const i = t.toLowerCase().indexOf(ql);
    if (i < 0) return;
    const l = locate(s.id);
    if (!l) return;
    const a = Math.max(0, i - 60), b = Math.min(t.length, i + q.length + 80);
    const snip = (a ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length, b)) + (b < t.length ? '…' : '');
    out.push({ s, l, snip: snip.replace(/\n+/g, ' ') });
  });
  return out;
}
function whereLabel(r) {
  if (r.l.where === 'doc') return `${esc(r.l.doc.name)} · page ${r.l.doc.pages.indexOf(r.s.id) + 1}`;
  return r.l.where === 'inbox' ? `Inbox · <span class="mono">${r.s.file}</span>` : `Set aside · <span class="mono">${r.s.file}</span>`;
}
function viewSearch() {
  const res = searchScans(U.q);
  return `
  <div class="head">
    <div class="crumbs">Search</div>
    <div class="title-row"><h1 class="title">${plural(res.length, 'page')} mention “${esc(U.q)}”</h1>
    <div class="actions"><button class="btn ai" data-act="askSearch">${icon('spark')} Ask Lindley about these</button></div></div>
    <p class="sub">Searches the text of every page, including handwriting read by the AI vision model and pages still in the Inbox.</p>
    <div style="height:6px"></div>
  </div>
  <div class="scroll"><div class="results">
    ${res.map(r => `<button class="res" data-open="${r.s.id}"><div class="pg-img"><img src="${pageImg(r.s.id)}" alt="" style="${rotStyle(r.s)}"></div><div><b>${whereLabel(r)}</b><p>${r.snip}</p></div></button>`).join('') || '<div class="empty">No pages match. Try a shorter word, or a different spelling. Old handwriting is often spelled loosely.</div>'}
  </div></div>`;
}

/* ================= Navigation ================= */
function go(nav, extra = {}) {
  U.nav = nav; U.sel.clear(); U.cur = 0; closeMenu();
  if (nav.t === 'doc' && !['grid', 'reader', 'side', 'details'].includes(U.view)) U.view = 'grid';
  Object.assign(U, extra);
  app.classList.remove('show-tree'); syncScrim();
  render();
  main.focus?.();
}
function openScan(id) {
  const l = locate(id);
  if (!l) return;
  if (l.where === 'doc') go({ t: 'doc', id: l.doc.id }, { view: 'side', cur: l.doc.pages.indexOf(id) });
  else {
    go({ t: l.where });
    U.sel.add(id); render();
    $(`[data-pg="${id}"]`)?.scrollIntoView({ block: 'center' });
  }
}

const menu = $('#menu');
let menuFns = [];
function openMenu(items, x, y) {
  menuFns = [];
  menu.innerHTML = items.map(it => {
    if (it === '-') return '<hr>';
    if (it.head) return `<div class="mh">${esc(it.head)}</div>`;
    menuFns.push(it.fn);
    return `<button role="menuitem" data-m="${menuFns.length - 1}" class="${it.cls || ''}" ${it.dis ? 'disabled' : ''}>${it.icon ? icon(it.icon) : ''}${esc(it.label)}</button>`;
  }).join('');
  menu.hidden = false;
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  menu.querySelector('button:not(:disabled)')?.focus();
}
function closeMenu() { menu.hidden = true; }
function moveItems(ids) {
  const here = curDoc()?.id;
  const docs = docsBy('progress').filter(d => d.id !== here);
  return [{ head: U.nav.t === 'doc' ? 'Move to document' : 'Add to document' },
    ...docs.map(d => ({ label: d.name, icon: 'doc', fn: () => moveTo(ids, d.id) })),
    '-', { label: 'New document', icon: 'newdoc', fn: () => moveTo(ids, null) }];
}
function pageMenuItems(ids) {
  const w = U.nav.t;
  const items = [
    { label: 'Rotate left', icon: 'rotL', fn: () => rotate(ids, -90) },
    { label: 'Rotate right', icon: 'rotR', fn: () => rotate(ids, 90) }];
  if (w === 'doc') items.push('-', { label: 'Move earlier', icon: 'up', fn: () => shift(ids, -1) }, { label: 'Move later', icon: 'down', fn: () => shift(ids, 1) });
  items.push('-', ...moveItems(ids).slice(1), '-');
  if (w !== 'inbox') items.push({ label: 'Return to Inbox', icon: 'inbox', fn: () => toInbox(ids) });
  if (w !== 'aside') items.push({ label: 'Set aside', icon: 'aside', fn: () => setAside(ids) });
  items.push('-', { label: 'Ask Lindley about ' + (ids.length === 1 ? 'this page' : 'these pages'), icon: 'spark', cls: 'ai', fn: () => askAbout(ids) });
  return items;
}

const AFN = [];
function pushMsg(from, html, acts = []) {

  const el = document.createElement('div');
  el.className = 'msg ' + from;
  el.innerHTML = html + (acts.length ? `<div class="msg-acts">${acts.map(a => { AFN.push(a.fn); return `<button data-afn="${AFN.length - 1}">${esc(a.label)}</button>`; }).join('')}</div>` : '');
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function showAi() {
  if (U.ai === 'collapsed') { U.ai = 'dock'; syncAi(); }
  if (matchMedia('(max-width: 860px)').matches) { app.classList.add('show-ai'); app.classList.remove('show-tree'); syncScrim(); }
}
function ask(q, silent) {
  q = q.trim();
  if (!q) return;
  showAi();
  if (!silent) pushMsg('me', `<p>${esc(q)}</p>`);
  const t = document.createElement('div');
  t.className = 'msg ai'; t.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  log.appendChild(t); log.scrollTop = log.scrollHeight;
  setTimeout(() => { t.remove(); answer(q); }, 650 + Math.random() * 500);
}
function answer(q) {
  const ql = q.toLowerCase();
  const d = curDoc();
  const pageCtx = d && (U.view === 'reader' || U.view === 'side') && d.pages.length;
  const m = q.match(/mention(?:ing|s)?\s+(.+?)[?.]*$/i);
  if (m || /\bfind\b/.test(ql)) {
    const term = m ? m[1].replace(/^(the name|name)\s+/, '') : 'Branson';
    const words = term.split(/\s+/);
    let res = searchScans(term);
    if (!res.length && words.length > 1) res = searchScans(words[words.length - 1]);
    if (!res.length) { pushMsg('ai', `<p>I couldn't find “${esc(term)}” on any page. Handwriting is sometimes read loosely, so try a surname on its own.</p>`); return; }
    const byDoc = new Map();
    res.forEach(r => { const k = r.l.where === 'doc' ? r.l.doc.id : r.s.id; if (!byDoc.has(k)) byDoc.set(k, r); });
    const top = [...byDoc.values()].slice(0, 6);
    pushMsg('ai', `<p>I found “${esc(term)}” on ${plural(res.length, 'page')}, in ${plural(byDoc.size, 'place')}. The first few:</p><ul>${top.map(r => `<li>${whereLabel(r)}</li>`).join('')}</ul>`,
      [...top.slice(0, 4).map(r => ({ label: 'Open ' + (r.l.where === 'doc' ? shortName(r.l.doc.name) : r.s.file), fn: () => openScan(r.s.id) })),
        { label: 'See all results', fn: () => { U.q = term; $('#search-q').value = term; go({ t: 'search' }); } }]);
    return;
  }
  if (/place|belong|sort|which inbox/.test(ql)) {
    const h = D.inbox.filter(id => D.scans[id].hint);
    if (!h.length) { pushMsg('ai', '<p>I can\'t place any more Inbox scans with confidence right now. As new scans arrive I\'ll check them against your documents.</p>'); return; }
    pushMsg('ai', `<p>I think ${plural(h.length, 'scan')} in the Inbox belong to documents in progress:</p><ul>${h.map(id => `<li><span class="mono">${D.scans[id].file}</span> → ${esc(D.docs[D.scans[id].hint].name)}</li>`).join('')}</ul><p>The other scans don't match anything yet. Some are receipts and blank pages that could be set aside.</p>`,
      [{ label: `Add all ${h.length}`, fn: () => { const g = {}; h.forEach(id => (g[D.scans[id].hint] ||= []).push(id)); commit(`Added ${plural(h.length, 'scan')} to their documents.`, () => { Object.entries(g).forEach(([doc, ids]) => ids.forEach(id => { detach(id); D.docs[doc].pages.push(id); D.scans[id].hint = null; })); }); } },
        { label: 'Show them in the Inbox', fn: () => { go({ t: 'inbox' }, { sort: 'match' }); } }]);
    return;
  }
  if (!d) {
    pushMsg('ai', '<p>Open a document and I can summarize it, check for missing pages, or explain its date. From anywhere, I can find every page that mentions a person or place.</p>');
    return;
  }
  if (pageCtx && /this page|page say|say\b|read/.test(ql)) {
    const s = D.scans[d.pages[U.cur]];
    const t = s.text.replace(/[{}]/g, '').replace(/\n+/g, ' ');
    pushMsg('ai', `<p>Page ${U.cur + 1} reads:</p><p><q>${esc(t.length > 320 ? t.slice(0, 320) + '…' : t)}</q></p>${s.text.includes('{') ? '<p>I wasn\'t sure of the highlighted words in the Scan and text view.</p>' : ''}`);
    return;
  }
  if (/order/.test(ql)) {
    if (d.note) pushMsg('ai', `<p>${esc(d.note.text)} The text agrees: the paragraph that ends page 2 continues at the top of page 3.</p>`, [{ label: d.note.fix, fn: fixOrder }]);
    else pushMsg('ai', '<p>The order looks right to me. Each page continues the sentence or entry from the page before.</p>');
    return;
  }
  if (/missing|complete|finish/.test(ql)) { pushMsg('ai', `<p>${esc(d.missing || 'I can\'t tell yet. I\'ll know more once all the pages have been read.')}</p>`); return; }
  if (/date|when|dated|year/.test(ql)) { pushMsg('ai', `<p>${esc(d.dateWhy || 'I haven\'t found a date on these pages yet.')}</p>`); return; }
  if (/common|these pages|together/.test(ql)) { pushMsg('ai', `<p>These pages are part of “${esc(d.name)}”. ${esc(d.why[0] || '')}.</p>`); return; }
  pushMsg('ai', `<p>${esc(d.summary || 'I\'m still reading this document.')}</p>`);
}
function askAbout(ids) {
  const d = curDoc();
  if (d && ids.length === 1) { U.cur = d.pages.indexOf(ids[0]); ask('What does this page say?'); if (U.view === 'grid') { U.view = 'side'; render(); } return; }
  if (!d) {
    const kinds = [...new Set(ids.map(id => ({ hand: 'handwritten', print: 'printed', typed: 'typewritten', receipt: 'receipts', blank: 'blank', note: 'notes' })[D.scans[id].kind]))];
    pushMsg('me', `<p>What can you tell me about these ${plural(ids.length, 'scan')}?</p>`); showAi();
    setTimeout(() => pushMsg('ai', `<p>${ids.length === 1 ? 'This scan is' : 'These scans are'} ${kinds.join(', ')}. ${ids.some(id => D.scans[id].hint) ? 'At least one looks like it belongs to a document in progress; see the suggestion under the page.' : 'None of them match a document in progress yet.'}</p>`), 700);
    return;
  }
  ask('What do these pages have in common?');
}
function fixOrder() {
  const d = curDoc();
  if (!d) return;
  commit('Put the pages in page-number order.', () => {
    d.pages.sort((a, b) => (+(D.scans[a].text.match(/- (\d+) -/) || [0, 0])[1]) - (+(D.scans[b].text.match(/- (\d+) -/) || [0, 0])[1]));
    d.note = null; d.conf = 86;
  });
}

function syncAi() {
  const mode = U.ai;
  ai.hidden = mode === 'collapsed';
  rail.hidden = mode !== 'collapsed';
  ai.classList.toggle('is-float', mode === 'float');
  if (mode === 'float') {
    ai.style.left = U.aiPos.x + 'px'; ai.style.top = U.aiPos.y + 'px';
  } else { ai.style.left = ai.style.top = ai.style.width = ai.style.height = ''; }
  $('#ai-pop').innerHTML = icon(mode === 'float' ? 'dock' : 'popout');
  $('#ai-pop').title = mode === 'float' ? 'Dock to the side' : 'Pop out into a floating window';
  $('#ai-pop').setAttribute('aria-label', $('#ai-pop').title);
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const t = e.target;
  if (!menu.hidden && !t.closest('#menu')) closeMenu();
  const m = t.closest('[data-m]');
  if (m) { closeMenu(); menuFns[+m.dataset.m]?.(); return; }
  const afn = t.closest('[data-afn]');
  if (afn) { AFN[+afn.dataset.afn]?.(); return; }
  const askB = t.closest('[data-ask]');
  if (askB) { ask(askB.dataset.ask); return; }
  const tog = t.closest('[data-toggle]');
  if (tog) { U.closed[tog.dataset.toggle] = !U.closed[tog.dataset.toggle]; renderTree(); return; }
  const nav = t.closest('[data-nav]');
  if (nav) {
    const [kind, id] = nav.dataset.nav.split(':');
    go({ t: kind, id });
    return;
  }
  const place = t.closest('[data-place]');
  if (place) { const [sid, did] = place.dataset.place.split(':'); moveTo([sid], did); return; }
  const open = t.closest('[data-open]');
  if (open) { openScan(open.dataset.open); return; }
  const view = t.closest('[data-view]');
  if (view) { U.view = view.dataset.view; U.sel.clear(); clampCur(); render(); return; }
  const gotoB = t.closest('[data-goto]');
  if (gotoB) { U.cur = +gotoB.dataset.goto; render(); return; }
  const sg = t.closest('[data-sugg]');
  if (sg) {
    const [f, how] = sg.dataset.sugg.split(':');
    const d = curDoc();
    if (how === 'use') setField(d.id, f, d.suggest[f], `Used Lindley's suggestion for ${f === 'type' ? 'kind of document' : f}.`);
    else commit('Dismissed the suggestion.', () => { d.dismissed.push(f); });
    return;
  }
  const ut = t.closest('[data-untag]');
  if (ut) { const d = curDoc(); commit(`Removed the tag “${ut.dataset.untag}”.`, () => { d.tags = d.tags.filter(x => x !== ut.dataset.untag); }); return; }

  const pg = t.closest('.pg');
  if (pg && !t.closest('button')) {
    const id = pg.dataset.pg;
    const list = U.nav.t === 'inbox' ? sortedInbox() : listIds();
    if (e.shiftKey && U.anchor && list.includes(U.anchor)) {
      const [a, b] = [list.indexOf(U.anchor), list.indexOf(id)].sort((x, y) => x - y);
      list.slice(a, b + 1).forEach(x => U.sel.add(x));
    } else if (e.ctrlKey || e.metaKey || t.closest('[data-check]')) {
      U.sel.has(id) ? U.sel.delete(id) : U.sel.add(id);
      U.anchor = id;
    } else {
      const only = U.sel.size === 1 && U.sel.has(id);
      U.sel.clear(); if (!only) U.sel.add(id);
      U.anchor = id;
    }
    renderMain(); renderAiContext();
    return;
  }

  const a = t.closest('[data-act]');
  if (!a || a.disabled) return;
  const ids = targets();
  const d = curDoc();
  const A = {
    rotL: () => rotate(ids, -90), rotR: () => rotate(ids, 90),
    up: () => shift(ids, -1), down: () => shift(ids, 1),
    inbox: () => toInbox(ids), aside: () => setAside(ids),
    newDoc: () => moveTo(ids, null),
    moveMenu: () => { const r = a.getBoundingClientRect(); openMenu(moveItems(ids), r.left, r.bottom + 4); },
    askSel: () => askAbout(ids),
    askDoc: () => ask('What is this document about?'),
    askInbox: () => ask('Which inbox scans can you place?'),
    askSearch: () => ask(`Find every page mentioning ${U.q}`),
    selAll: () => { if (U.sel.size === d.pages.length) U.sel.clear(); else d.pages.forEach(p => U.sel.add(p)); renderMain(); },
    sortMatch: () => { U.sort = 'match'; renderMain(); },
    export: () => confirmExport(d.id),
    modalExport: () => { closeModal(); exportDoc(a.dataset.id); },
    modalClose: closeModal,
    reopen: () => reopen(d.id),
    notReady: () => commit('Okay. Lindley will leave this document in progress.', () => { d.ready = false; }),
    fixOrder,
    dismissNote: () => commit('Kept the current page order.', () => { d.note = null; }),
    addMatches: () => { const h = D.inbox.filter(id => D.scans[id].hint === d.id); moveTo(h, d.id); },
    showMatches: () => { const h = D.inbox.filter(id => D.scans[id].hint === d.id); go({ t: 'inbox' }, { sort: 'match' }); h.forEach(id => U.sel.add(id)); render(); },
    useAll: () => commit('Used all of Lindley\'s suggestions.', () => { Object.entries(d.suggest).forEach(([f, v]) => { if (!d.dismissed.includes(f)) d[f] = v; }); }),
    saveTx: () => { const s = D.scans[d.pages[U.cur]]; const v = $('#tx').innerText.replace(/\n{3,}/g, '\n\n').trim(); commit(`Saved the transcription for page ${U.cur + 1}.`, () => { s.text = v; s.conf = 100; }); },
    prev: () => { U.cur = Math.max(0, U.cur - 1); render(); },
    next: () => { U.cur = Math.min(d.pages.length - 1, U.cur + 1); render(); },
    zin: () => { U.zoom = Math.min(3, +(U.zoom + .25).toFixed(2)); renderMain(); },
    zout: () => { U.zoom = Math.max(.5, +(U.zoom - .25).toFixed(2)); renderMain(); },
    zfit: () => { U.zoom = 1; renderMain(); },
    newFolder: () => commit('Created a folder. Click its name to rename it.', () => { const id = 'f' + D.nextFolder++; D.folders[id] = { id, name: 'New folder', parent: null, children: [], docs: [] }; D.rootFolders.push(id); U.nav = { t: 'folder', id }; }),
    undo,
  };
  A[a.dataset.act]?.();
});

main.addEventListener('dblclick', e => {
  const pg = e.target.closest('.pg');
  if (!pg || U.nav.t !== 'doc') return;
  U.cur = curDoc().pages.indexOf(pg.dataset.pg); U.view = 'reader'; U.sel.clear(); render();
});
main.addEventListener('contextmenu', e => {
  const pg = e.target.closest('.pg');
  if (!pg || curDoc()?.status === 'complete') return;
  e.preventDefault();
  const id = pg.dataset.pg;
  if (!U.sel.has(id)) { U.sel.clear(); U.sel.add(id); renderMain(); }
  openMenu(pageMenuItems(targets()), e.clientX, e.clientY);
});
main.addEventListener('keydown', e => {
  const pg = e.target.closest('.pg');
  if (pg && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pg.click(); }
});
main.addEventListener('change', e => {
  const t = e.target;
  const d = curDoc();
  if (t.id === 'doc-title' && d) { const v = t.value.trim(); if (v) setField(d.id, 'name', v, 'Renamed the document.'); else t.value = d.name; }
  else if (t.id === 'folder-title') { const f = D.folders[U.nav.id]; const v = t.value.trim(); if (v && v !== f.name) commit('Renamed the folder.', () => { f.name = v; }); }
  else if (t.dataset.field && d) setField(d.id, t.dataset.field, t.value.trim());
  else if (t.id === 'sort') { U.sort = t.value; renderMain(); }
});
main.addEventListener('input', e => {
  if (e.target.id === 'thumb') { U.thumb = +e.target.value; $('#grid')?.style.setProperty('--thumb', U.thumb + 'px'); }
});
main.addEventListener('keydown', e => {
  if (e.target.id === 'det-tag' && e.key === 'Enter') {
    const v = e.target.value.trim(); const d = curDoc();
    if (v && !d.tags.includes(v)) commit(`Added the tag “${v}”.`, () => { d.tags.push(v); });
  }
  if (e.target.id === 'doc-title' && e.key === 'Enter') e.target.blur();
});

/* Drag and drop: reorder within a document, or drop onto the tree */
let drag = null;
main.addEventListener('dragstart', e => {
  const pg = e.target.closest('.pg');
  if (!pg) return;
  const id = pg.dataset.pg;
  if (!U.sel.has(id)) { U.sel.clear(); U.sel.add(id); $$('.pg', main).forEach(p => p.classList.toggle('is-sel', p.dataset.pg === id)); }
  drag = listIds().filter(x => U.sel.has(x));
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  requestAnimationFrame(() => drag?.forEach(x => $(`[data-pg="${x}"]`, main)?.classList.add('is-dragging')));
});
main.addEventListener('dragend', () => { drag = null; $$('.is-dragging,.drop-before,.drop-after').forEach(el => el.classList.remove('is-dragging', 'drop-before', 'drop-after')); $$('.is-drop').forEach(el => el.classList.remove('is-drop')); });
main.addEventListener('dragover', e => {
  const pg = e.target.closest('.pg');
  if (!drag || !pg || U.nav.t !== 'doc' || curDoc().status === 'complete') return;
  e.preventDefault();
  const r = pg.getBoundingClientRect();
  const after = e.clientX > r.left + r.width / 2;
  $$('.drop-before,.drop-after', main).forEach(el => el.classList.remove('drop-before', 'drop-after'));
  pg.classList.add(after ? 'drop-after' : 'drop-before');
});
main.addEventListener('drop', e => {
  const pg = e.target.closest('.pg');
  if (!drag || !pg) return;
  e.preventDefault();
  const r = pg.getBoundingClientRect();
  const ids = drag; drag = null;
  reorderDrop(ids, pg.dataset.pg, e.clientX > r.left + r.width / 2);
});
tree.addEventListener('dragover', e => {
  const tg = e.target.closest('[data-drop]');
  $$('.is-drop', tree).forEach(el => el !== tg && el.classList.remove('is-drop'));
  if (!drag || !tg) return;
  const [k, id] = tg.dataset.drop.split(':');
  if ((k === 'doc' && U.nav.t === 'doc' && U.nav.id === id) || k === U.nav.t && k !== 'doc') return;
  e.preventDefault();
  tg.classList.add('is-drop');
});
tree.addEventListener('dragleave', e => { e.target.closest?.('[data-drop]')?.classList.remove('is-drop'); });
tree.addEventListener('drop', e => {
  const tg = e.target.closest('[data-drop]');
  if (!drag || !tg) return;
  e.preventDefault();
  const ids = drag; drag = null;
  const [k, id] = tg.dataset.drop.split(':');
  if (k === 'doc') moveTo(ids, id); else if (k === 'inbox') toInbox(ids); else setAside(ids);
});

/* Keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenu(); if (!modal.hidden) closeModal(); app.classList.remove('show-tree', 'show-ai'); syncScrim(); }
  const typing = e.target.closest('input, textarea, select, [contenteditable="true"]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  if (!typing && curDoc() && (U.view === 'reader' || U.view === 'side')) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { U.cur = Math.min(curDoc().pages.length - 1, U.cur + 1); render(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { U.cur = Math.max(0, U.cur - 1); render(); }
  }
});

/* Search */
$('#search-form').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#search-q').value.trim();
  if (!q) return;
  U.q = q; go({ t: 'search' });
});

/* AI panel controls */
$('#ai-form').addEventListener('submit', e => { e.preventDefault(); const v = $('#ai-input').value; $('#ai-input').value = ''; ask(v); });
$('#ai-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#ai-form').requestSubmit(); } });
$('#ai-pop').addEventListener('click', () => {
  if (U.ai === 'float') U.ai = 'dock';
  else {
    const r = app.getBoundingClientRect();
    U.aiPos = { x: Math.max(12, r.width - 400), y: 70 };
    U.ai = 'float';
  }
  syncAi();
});
$('#ai-close').addEventListener('click', () => {
  if (matchMedia('(max-width: 860px)').matches) { app.classList.remove('show-ai'); syncScrim(); return; }
  U.ai = 'collapsed'; syncAi();
});
rail.addEventListener('click', () => { U.ai = 'dock'; syncAi(); });
$('#ai-toggle').addEventListener('click', () => { app.classList.toggle('show-ai'); app.classList.remove('show-tree'); if (U.ai === 'collapsed') { U.ai = 'dock'; syncAi(); } syncScrim(); });
$('#tree-toggle').addEventListener('click', () => { app.classList.toggle('show-tree'); app.classList.remove('show-ai'); syncScrim(); });
scrim.addEventListener('click', () => { if (!modal.hidden) closeModal(); app.classList.remove('show-tree', 'show-ai'); syncScrim(); });

/* Dragging the floating AI window by its header */
$('#ai-h').addEventListener('pointerdown', e => {
  if (U.ai !== 'float' || e.target.closest('button') || matchMedia('(max-width: 860px)').matches) return;
  const ar = app.getBoundingClientRect(), r = ai.getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  $('#ai-h').setPointerCapture(e.pointerId);
  const mv = ev => {
    U.aiPos.x = Math.max(0, Math.min(ev.clientX - ar.left - ox, ar.width - r.width));
    U.aiPos.y = Math.max(0, Math.min(ev.clientY - ar.top - oy, ar.height - 60));
    ai.style.left = U.aiPos.x + 'px'; ai.style.top = U.aiPos.y + 'px';
  };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
});

/* Theme */
function effectiveTheme() { return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function syncThemeBtn() { $('#theme-btn').innerHTML = icon(effectiveTheme() === 'dark' ? 'sun' : 'moon'); }
$('#theme-btn').addEventListener('click', () => { document.documentElement.dataset.theme = effectiveTheme() === 'dark' ? 'light' : 'dark'; syncThemeBtn(); });

/* Simulated background reading of new scans */
setInterval(() => {
  const id = D.inbox.find(x => D.scans[x].status === 'reading');
  if (!id) return;
  const s = D.scans[id];
  s.status = 'read';
  s.conf = s.engine === 'vision' ? 70 + Math.floor(Math.random() * 20) : 90 + Math.floor(Math.random() * 9);
  renderTree(); renderStatus();
  if (U.nav.t === 'inbox') renderMain();
}, 6000);

/* ================= Boot ================= */
function boot() {
  D = buildData();
  U = { nav: { t: 'doc', id: 'd1' }, view: 'grid', sel: new Set(), anchor: null, cur: 0, zoom: 1, closed: {}, ai: 'dock', aiPos: { x: 0, y: 70 }, q: '', sort: 'new', thumb: 150 };
  $('#tree-toggle').innerHTML = icon('menu');
  $('#ai-toggle').innerHTML = icon('spark');
  $('#ai-spark').innerHTML = icon('spark');
  $('#rail-ic').innerHTML = icon('spark');
  $('#ai-close').innerHTML = icon('close');
  $('#ai-send').innerHTML = icon('send');
  syncThemeBtn();
  syncAi();
  render();
  pushMsg('ai', '<p>Hello, I\'m Lindley. I can tell you about the document you have open, check whether pages are missing, or find every page that mentions a name.</p><p>Right now I\'m looking at a letter I think is complete. Try one of the questions below.</p>');
}
const fontsReady = Promise.all(['19px "Homemade Apple"', '18px "IM Fell English"', '16px "Special Elite"', '14px "IBM Plex Mono"'].map(f => document.fonts.load(f).catch(() => null)));
Promise.race([fontsReady, new Promise(r => setTimeout(r, 3000))]).then(boot);
})();
</script>
