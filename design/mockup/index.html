<meta charset="utf-8">
<title>Lindley Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Homemade+Apple&family=IM+Fell+English&family=Special+Elite&display=swap">
<style>
:root {
  --bg: #E3E7E1;
  --surface: #F7F8F5;
  --panel: #EDF0EA;
  --raise: #FFFFFF;
  --line: #D2D8D0;
  --line-strong: #B9C2B7;
  --ink: #1B2420;
  --muted: #56635C;
  --faint: #66716B;
  --field: #7C8781;
  --accent: #2A4F86;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE5F3;
  --ai: #8A5A00;
  --ai-soft: #F6ECD6;
  --ok: #2F7A47;
  --ok-soft: #DCEFE2;
  --warn: #9A5606;
  --warn-soft: #F8E7CF;
  --stage: #D5DAD3;
  --shadow: 0 1px 2px rgba(20, 30, 25, .08), 0 8px 24px rgba(20, 30, 25, .10);
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1211; --surface: #161B19; --panel: #1A201E; --raise: #212825;
    --line: #2C3531; --line-strong: #3C4742; --ink: #E2E8E4; --muted: #9DA8A2; --faint: #8A958F; --field: #74807A;
    --accent: #8FB1EA; --accent-ink: #0E1211; --accent-soft: #22314A;
    --ai: #E2B45E; --ai-soft: #36291A; --ok: #7FC794; --ok-soft: #1C3325;
    --warn: #E6A75C; --warn-soft: #3A2A16; --stage: #0F1312;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1211; --surface: #161B19; --panel: #1A201E; --raise: #212825;
  --line: #2C3531; --line-strong: #3C4742; --ink: #E2E8E4; --muted: #9DA8A2; --faint: #8A958F; --field: #74807A;
  --accent: #8FB1EA; --accent-ink: #0E1211; --accent-soft: #22314A;
  --ai: #E2B45E; --ai-soft: #36291A; --ok: #7FC794; --ok-soft: #1C3325;
  --warn: #E6A75C; --warn-soft: #3A2A16; --stage: #0F1312;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 12px;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
/* The Lindley mark: one shape that always means "this gets you Lindley, the AI". */
.lic { width: var(--lic-size, 20px); height: var(--lic-size, 20px); flex: none; color: var(--ai); }

/* ---------- App frame ---------- */
.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr) auto;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.top {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: .01em; min-width: 0; }
.brand .lic { --lic-size: 28px; }
.search { flex: 1; max-width: 520px; position: relative; }
.search input {
  width: 100%; padding: 7px 10px 7px 34px;
  border: 1px solid var(--field); border-radius: 6px; background: var(--raise);
}
.search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.spacer { flex: 1; }
.sample { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line-strong); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--muted); }
.icon-btn:hover { background: var(--panel); color: var(--ink); }
.mobile-only { display: none; }

/* ---------- Tree ---------- */
.tree {
  grid-row: 2; grid-column: 1;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px 8px 16px;
  display: flex; flex-direction: column; gap: 1px;
}
.t-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 5px 8px 5px calc(8px + var(--d, 0) * 14px);
  border: 1px solid transparent; border-radius: 6px; background: none; text-align: left;
}
.t-item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.t-item.is-active { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); font-weight: 500; }
.t-item.is-active > .ic { color: var(--accent); }
.t-item.is-drop { border-color: var(--accent); border-style: dashed; background: var(--accent-soft); }
.t-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-item.is-temp .t-name { font-style: italic; }
.t-item.t2 { align-items: flex-start; padding-block: 4px; }
.t-item.t2 > .ic { margin-top: 1px; }
.t-txt { flex: 1; min-width: 0; display: grid; }
.t2 .t-name { font-size: 13.5px; line-height: 1.35; }
.t-meta { display: flex; flex-wrap: wrap; align-items: center; column-gap: 5px; font-size: 12px; line-height: 1.45; color: var(--muted); font-weight: 400; }
.t-dot { color: var(--muted); }
.count { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.count.strong { font-weight: 600; color: var(--ink); background: var(--raise); border: 1px solid var(--line); padding: 0 7px; border-radius: 999px; }
.t-inbox { font-weight: 600; padding-block: 8px; }
.t-sec { margin-top: 10px; }
.t-sec-h {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 4px 8px; border: 0; background: none;
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-radius: 6px;
}
.t-sec-h.is-drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.t-sec-h .chev { width: 14px; height: 14px; transition: transform .15s; }
.t-sec-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.t-list { display: flex; flex-direction: column; gap: 1px; }
.t-ready { font-size: 12px; font-weight: 600; color: var(--ink); border: 1px solid var(--field); padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.t-flag, .f-meta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-flag { color: var(--ink); font-weight: 600; }
.t-flag .ic, .f-meta .ic { width: 14px; height: 14px; }
.t-review { font-weight: 600; }
.t-review .count.strong { border-color: var(--field); }
.t-add { display: flex; align-items: center; gap: 6px; margin: 4px 0 0 8px; padding: 4px 8px; border: 0; background: none; color: var(--muted); font-size: 13px; }
.t-add:hover { color: var(--accent); }
.t-add .ic { width: 15px; height: 15px; }
.legend { margin-top: auto; padding: 12px 8px 0; font-size: 12px; color: var(--muted); display: grid; gap: 5px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend .ic { width: 15px; height: 15px; color: var(--ink); }
.legend .lic { --lic-size: 16px; }

/* ---------- Main ---------- */
.main { position: relative; container-type: inline-size; grid-row: 2; grid-column: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 14px 20px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.crumbs { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title-in {
  flex: 1 1 280px; min-width: 0;
  font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.2;
  padding: 2px 6px; margin-left: -6px; border: 1px solid transparent; border-radius: 6px; background: none;
}
.title-in:hover:not([readonly]) { border-color: var(--field); }
.title-in:focus { border-color: var(--accent); background: var(--raise); outline: none; }
.title-in.is-temp { font-style: italic; }
h1.title { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.2; flex: 1 1 280px; text-wrap: balance; }
.sub { margin: 0 0 4px; color: var(--muted); max-width: 70ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 6px;
  border: 1px solid var(--line-strong); background: var(--raise); white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ai { border-color: var(--ai); color: var(--ink); background: var(--ai-soft); font-weight: 500; }
.btn.ai:hover:not(:disabled) { color: var(--ink); }
.btn.ask { padding: 6px 14px 6px 10px; font-size: 15px; }
.btn.ask .lic { --lic-size: 22px; }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn .ic { width: 16px; height: 16px; }
.btn .lic { --lic-size: 18px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
.chip.ai { background: var(--ai-soft); border-color: transparent; color: var(--ink); }
.chip .ic { width: 14px; height: 14px; }
.chip .lic { --lic-size: 14px; }
.meter { display: inline-flex; align-items: center; gap: 6px; }
.meter b { display: inline-block; width: 54px; height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.meter b { border: 1px solid var(--field); height: 7px; }
.meter b::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--ink); }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.banner > div { flex: 1 1 260px; }
.banner.ok { background: var(--ok-soft); }
.banner.ok > .ic { color: var(--ok); }
.banner.warn { background: var(--warn-soft); }
.banner.warn > .ic { color: var(--warn); }
.banner.ai { background: var(--ai-soft); }
.banner.review { background: var(--warn-soft); }
.banner.review > .ic { color: var(--warn); }
.banner .btn { padding: 4px 10px; font-size: 13px; }
.tabs { display: flex; gap: 2px; margin-top: 2px; overflow-x: auto; }
.tab { padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }

.viewbar { display: flex; align-items: center; justify-content: flex-end; gap: 14px; flex-wrap: wrap; padding: 0 0 8px; font-size: 12px; color: var(--muted); }
.viewbar label { display: inline-flex; align-items: center; gap: 6px; }
.viewbar select { padding: 3px 6px; border: 1px solid var(--field); border-radius: 6px; background: var(--raise); font-size: 13px; }
.viewbar .btn { padding: 3px 10px; font-size: 13px; }
.tabrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tabrow .viewbar { padding-bottom: 6px; }
.crumb { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; font-size: 12px; }

/* The action dock floats centered over the content, close to where you are looking. */
.dock-wrap { position: absolute; left: 12px; right: 12px; bottom: 14px; z-index: 20; display: flex; justify-content: center; pointer-events: none; }
.dock {
  pointer-events: auto; display: flex; align-items: center; gap: 2px; max-width: 100%; overflow-x: auto;
  padding: 6px; border: 1px solid var(--field); border-radius: 14px; background: var(--raise); box-shadow: var(--shadow);
}
.dock .btn { flex: none; padding: 7px 11px; border-color: transparent; background: none; font-size: 14px; }
.dock .btn:hover:not(:disabled) { background: var(--panel); border-color: var(--line); color: var(--ink); }
.dock .btn.ico { padding: 7px; }
.dock .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dock .btn.primary:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); filter: brightness(1.08); }
.dock .btn.ai { background: var(--ai-soft); border-color: var(--ai); }
.btn.next { flex-direction: row-reverse; }
.dock .sep { flex: none; width: 1px; align-self: stretch; margin: 4px 6px; background: var(--line); }
.dock-sel { flex: none; padding: 0 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dock-prog { flex: none; display: grid; justify-items: center; gap: 4px; padding: 0 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
.dock-prog b { width: 160px; height: 7px; border-radius: 4px; border: 1px solid var(--field); position: relative; overflow: hidden; }
.dock-prog b::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--ink); }
.dock-hint { flex: none; padding: 0 8px; font-size: 12px; color: var(--muted); }
.main.has-dock .grid, .main.has-dock .docs, .main.has-dock .results, .main.has-dock .empty, .main.has-dock .rv-done { padding-bottom: 96px; }
.main.has-dock .side-tx, .main.has-dock .side-img { padding-bottom: 90px; }
.main.has-dock .reader .strip { padding-bottom: 84px; }
@container (max-width: 760px) {
  .dock .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dock .btn { padding: 7px; }
  .dock-hint { display: none; }
  .dock-prog b { width: 90px; }
}

.scroll { flex: 1; overflow: auto; min-height: 0; }

/* Page grid */
.grid { --thumb: 150px; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--thumb), 1fr)); gap: 16px; padding: 18px 20px 28px; align-content: start; }
.pg { position: relative; display: flex; flex-direction: column; gap: 6px; border-radius: 8px; padding: 6px; border: 2px solid transparent; user-select: none; }
.pg:hover { background: var(--panel); }
.pg-main { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; text-align: left; border-radius: 4px; }
.pg-main:focus-visible { outline-offset: 4px; }
.pg.is-sel { border-color: var(--accent); background: var(--accent-soft); }
.pg.drop-before { box-shadow: -6px 0 0 -2px var(--accent); }
.pg.drop-after { box-shadow: 6px 0 0 -2px var(--accent); }
.pg.is-dragging { opacity: .4; }
.pg-img { aspect-ratio: 3 / 4; display: grid; place-items: center; overflow: hidden; border-radius: 3px; background: var(--stage); }
.pg-img img, .rot { transform: rotate(var(--r, 0deg)) scale(var(--s, 1)); transition: transform .25s ease; }
.pg-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pg-check {
  position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 5px;
  display: grid; place-items: center; background: var(--raise); border: 1px solid var(--field); opacity: 0; color: var(--accent-ink);
}
.pg:hover .pg-check, .pg.is-sel .pg-check, .pg-main:focus-visible .pg-check { opacity: 1; }
.pg.is-sel .pg-check { background: var(--accent); border-color: var(--accent); }
.pg-check .ic { width: 14px; height: 14px; stroke-width: 2.4; }
.pg-f { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 2px 6px; font-size: 12px; }
.pg-lbl { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-lbl.mono { font-weight: 400; color: var(--muted); }
.conf { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 0 6px; border-radius: 4px; border: 1px solid transparent; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.conf .ic { width: 13px; height: 13px; }
.conf.flag { color: var(--ink); background: var(--warn-soft); border-color: var(--warn); font-weight: 600; }
.conf.flag .ic { color: var(--warn); }
.conf.mine { color: var(--ink); }
.conf.reading { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.pg-flag { position: absolute; top: 6px; right: 6px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; background: var(--raise); color: var(--ink); border: 1px solid var(--field); padding: 0 6px; border-radius: 4px; }
.pg-flag .ic { width: 13px; height: 13px; }
.pg-hint {
  display: flex; align-items: center; gap: 4px; width: 100%;
  min-height: 28px; padding: 3px 6px; border-radius: 5px; border: 1px dashed var(--ai);
  background: var(--ai-soft); color: var(--ink); font-size: 12px; text-align: left;
}
.pg-hint span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-hint .lic { --lic-size: 16px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }

/* Reader */
.reader { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
.rd-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rd-stage { overflow: auto; background: var(--stage); display: grid; place-items: center; padding: 24px; }
.rd-stage img { width: calc(var(--z) * min(560px, 100%)); max-width: none; box-shadow: var(--shadow); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px; border-top: 1px solid var(--line); }
.strip button { flex: none; width: 58px; padding: 2px; border: 2px solid transparent; border-radius: 4px; background: none; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip .pg-img img { transition: none; }
.strip span { display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); }
.strip span .ic { width: 12px; height: 12px; color: var(--warn); }

/* Side by side */
.side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }
.side-img { background: var(--stage); overflow: auto; display: grid; place-items: center; padding: 20px; }
.side-img img { max-height: 100%; max-width: 100%; box-shadow: var(--shadow); }
.side-tx { overflow: auto; padding: 16px 22px 24px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--line); }
.side-h { display: flex; align-items: center; gap: 8px; }
.side-h strong { flex: 1; }
.engine { font-size: 12px; color: var(--muted); }
.tx {
  font-family: var(--serif); font-size: 16.5px; line-height: 1.6; white-space: pre-wrap; max-width: 62ch;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); min-height: 200px;
}
.tx:focus { outline: none; border-color: var(--accent); }
.tx mark { background: var(--ai-soft); color: inherit; border-bottom: 2px dotted var(--ai); padding: 0 1px; }
.note { font-size: 13px; color: var(--muted); margin: 0; max-width: 62ch; }
.rv-state { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; max-width: 62ch; }
.rv-state.flag { background: var(--warn-soft); }
.rv-state.flag > .ic { color: var(--warn); }
.rv-state.mine { background: var(--panel); }
.rv-where { font-size: 13px; color: var(--muted); }
.rv-strip { border-top: 0; padding: 2px 0 10px; }
.fld { font-size: 13px; font-weight: 600; margin-bottom: -8px; }
.fld-in { width: 100%; padding: 8px 10px; border: 1px solid var(--field); border-radius: 6px; background: var(--raise); }
.fld-hint { display: flex; align-items: center; gap: 6px; margin-top: -6px !important; font-size: 13px; }
.fld-hint .lic { --lic-size: 16px; }
.rv-where b { color: var(--ink); font-weight: 500; }
.rv-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.rv-done { display: grid; justify-items: center; gap: 10px; padding: 64px 20px; text-align: center; color: var(--muted); }

.rv-done h2 { margin: 0; font-family: var(--serif); color: var(--ink); }

.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 20px; }

.dcard:hover { border-color: var(--accent); }
.dcard .pg-img { width: 64px; flex: none; }
.dcard b { display: block; font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1.25; margin-bottom: 4px; }
.dcard small { color: var(--muted); display: flex; align-items: center; gap: 4px; }
.dcard small .ic { width: 14px; height: 14px; color: var(--ink); }
.dcard.is-drop { border-color: var(--accent); border-style: dashed; }

/* Search */
.results { display: grid; gap: 4px; padding: 12px 20px 24px; max-width: 900px; }
.res { display: flex; gap: 14px; padding: 10px; border: 1px solid transparent; border-radius: 8px; background: none; text-align: left; align-items: flex-start; }
.res:hover { background: var(--panel); border-color: var(--line); }
.res .pg-img { width: 56px; flex: none; }
.res b { font-weight: 600; }
.res p { margin: 4px 0 0; font-family: var(--serif); font-size: 15px; color: var(--muted); }
.res mark { background: var(--accent-soft); color: var(--ink); padding: 0 2px; border-radius: 2px; font-weight: 600; text-decoration: underline; }

/* Status bar */
.status {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 5px 12px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); background: var(--panel);
}
.status .ic { width: 14px; height: 14px; }
.status span, .status button { display: inline-flex; align-items: center; gap: 6px; }
.status button { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.dot.busy { background: var(--ai); animation: pulse 1.2s infinite; }

/* ---------- Ask Lindley ---------- */
.ai-pane {
  grid-row: 2; grid-column: 3; width: 340px;
  display: flex; flex-direction: column; min-height: 0;
  border-left: 1px solid var(--line); background: var(--raise);
}
.ai-pane.is-float {
  position: absolute; z-index: 30; width: 360px; height: 480px;
  border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow);
  resize: both; overflow: hidden; min-width: 280px; min-height: 300px;
}
.ai-h { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); }
.ai-pane.is-float .ai-h { cursor: move; background: var(--panel); }
.ai-h strong { flex: 1; font-family: var(--serif); font-size: 17px; }
.ai-h .lic { --lic-size: 26px; }
.ai-h .icon-btn { width: 28px; height: 28px; }
.ai-ctx { padding: 6px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface); }
.ai-ctx b { color: var(--ink); font-weight: 500; }
.ai-log { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; font-size: 13.5px; }
.msg p { margin: 0 0 6px; }
.msg p:last-child { margin: 0; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
.msg.ai { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 3px; }
.msg ul { margin: 4px 0; padding-left: 18px; display: grid; gap: 3px; }
.msg q { font-family: var(--serif); font-style: italic; }
.msg-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg-acts button { font-size: 13px; min-height: 28px; padding: 2px 10px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--raise); }
.msg-acts button:hover { border-color: var(--accent); color: var(--accent); }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: pulse 1s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
.ai-sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
.ai-sugg button { font-size: 13px; min-height: 28px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--ai); background: var(--ai-soft); color: var(--ink); text-align: left; }
.ai-form { display: flex; gap: 6px; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
.ai-form textarea { flex: 1; resize: none; padding: 7px 9px; border: 1px solid var(--field); border-radius: 8px; background: var(--surface); min-height: 38px; }
.ai-form button { align-self: flex-end; }
.ai-rail {
  grid-row: 2; grid-column: 3; width: 44px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px;
  border: 0; border-left: 1px solid var(--line); background: var(--raise); color: var(--ink);

.ai-rail .lic { --lic-size: 28px; }
.ai-rail span { writing-mode: vertical-rl; font-family: var(--serif); font-size: 14px; font-weight: 600; letter-spacing: .03em; }

/* ---------- Overlays ---------- */
.menu {
  position: fixed; z-index: 60; min-width: 220px; max-width: min(320px, calc(100vw - 32px));

.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--accent-soft); }
.menu button[data-depth] { padding-left: calc(10px + var(--d) * 16px); }

.menu .lic { --lic-size: 18px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; width: auto; }
.menu .mh { padding: 4px 10px 2px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.menu .ic { width: 16px; height: 16px; }
.toast {
  position: fixed; z-index: 70; left: 50%; bottom: 128px; transform: translateX(-50%);

.scrim { position: absolute; inset: 0; z-index: 40; background: rgba(10, 15, 12, .35); }
.modal {

.modal p { margin: 0; color: var(--muted); }
.modal .actions { justify-content: flex-end; }

  .status .hide-narrow { display: none; }

}
function drawPage(s) {

    } else {
      g.fillStyle = '#3b3b3b'; g.font = '14px "IBM Plex Mono", monospace';
      wrap(g, text, w - 40).forEach((l, i) => g.fillText(l, 20, 40 + i * 24));

  }
  g.translate(PW / 2, PH / 2); g.rotate((r() - .5) * .02); g.translate(-PW / 2, -PH / 2);

    const fg = g.createRadialGradient(x, y, 0, x, y, rad);
    fg.addColorStop(0, `rgba(140,95,45,${.1 + r() * .22})`); fg.addColorStop(1, 'rgba(140,95,45,0)');

    g.font = '21px "Homemade Apple", cursive';
    const paras = text.split('\n');
    let y = 104;
    paras.forEach((p, pi) => {
      if (!p.trim()) { y += 16; return; }
      const right = pi < 2 && p.length < 34 && !/^(Dear|Friend|My)/.test(p) && paras.length > 3;
      wrap(g, p, PW - 130).forEach(l => {
        if (y > PH - 50) return;

    const paras = text.split('\n');

      if (!p.trim()) { y += 12; return; }
      const title = pi === 0 && p === p.toUpperCase();

}

    if (!target) {
      const id = 'd' + D.nextDoc++;
      D.docs[id] = { id, name: opts.name || `Untitled document ${D.nextDoc - 6}`, temp: !opts.name, status: 'progress', conf: 50, pages: [], type: '', date: '', people: '', place: '', tags: [], notes: '', ready: false, dismissed: [], note: null, why: ['You grouped these pages yourself'], suggest: {}, summary: 'You started this document by hand. Lindley will suggest a name and date once it has read the pages together.' };
      target = D.docs[id];
      if (opts.folder) D.folders[opts.folder].docs.push(id);
    }
    const touched = ids.map(id => detach(id)).filter(l => l && l.doc).map(l => l.doc);
    ids.forEach(id => { target.pages.push(id); D.scans[id].hint = null; });
    U.sel.clear();
    const removed = dropEmptyDocs(touched);
    if (!D.docs[docId] || U.nav.t === 'scan') { U.nav = { t: 'doc', id: target.id }; U.view = 'grid'; }
    clampCur();
    return removed.length ? `The empty document “${shortName(removed[0])}” was removed.` : '';
  });
}
function toInbox(ids) {
  if (!ids.length) return;
  commit(`Returned ${plural(ids.length, 'page')} to the Inbox. Lindley will read and sort ${ids.length === 1 ? 'it' : 'them'} again.`, () => {
    const touched = ids.map(id => detach(id)).filter(l => l && l.doc).map(l => l.doc);
    ids.forEach(id => { D.inbox.unshift(id); Object.assign(D.scans[id], { hint: null, status: 'reading', scanned: new Date().toISOString().slice(0, 16) }); });
    U.sel.clear();
    const removed = dropEmptyDocs(touched);
    clampCur();
    return removed.length ? `The empty document “${shortName(removed[0])}” was removed.` : '';
  });
}
function setAside(ids) {
  if (!ids.length) return;
  commit(`Set aside ${plural(ids.length, 'scan')}. Nothing was deleted.`, () => {
    const touched = ids.map(id => detach(id)).filter(l => l && l.doc).map(l => l.doc);
    ids.forEach(id => { D.aside.unshift(id); D.scans[id].hint = null; });
    U.sel.clear();
    dropEmptyDocs(touched);
    clampCur();
  });
}
function reorderDrop(dragIds, targetId, after) {
  const d = curDoc();
  if (!d || dragIds.includes(targetId)) return;
  commit(`Moved ${plural(dragIds.length, 'page')}.`, () => {
    const moving = d.pages.filter(p => dragIds.includes(p));
    const rest = d.pages.filter(p => !dragIds.includes(p));
    rest.splice(rest.indexOf(targetId) + (after ? 1 : 0), 0, ...moving);
    d.pages = rest;
  });
}
function exportDoc(id) {
  const d = D.docs[id];
  const f = folderOf(id);
  commit(`Exported “${shortName(d.name)}” as a searchable PDF. ${f ? `It stays in ${f.name}, marked Completed.` : 'It moved to Completed.'}`, () => {
    d.status = 'complete'; d.temp = false; d.ready = false;
    d.exported = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  });
}
function reopen(id) {
  const d = D.docs[id];
  commit(`Reopened “${shortName(d.name)}”. The exported PDF is kept until you export again.`, () => { d.status = 'progress'; });
}
function confirmPage(id, text) {
  const s = D.scans[id];
  commit(text == null ? 'Marked the page as checked.' : 'Saved your correction and marked the page as checked.', () => {
    s.text = (text == null ? s.text : text).replace(/[{}]/g, '');
    s.reviewed = true;
    clampCur();
  });
}
function fileDoc(docId, fid) {
  const d = D.docs[docId];
  const from = folderOf(docId);
  if ((from?.id ?? null) === fid) return;
  const home = d.status === 'complete' ? 'Completed' : 'In progress';
  commit(fid ? `Moved “${shortName(d.name)}” to ${D.folders[fid].name}.` : `Took “${shortName(d.name)}” out of ${from.name}. It's back under ${home}.`, () => {
    if (from) from.docs = from.docs.filter(x => x !== docId);
    if (fid) D.folders[fid].docs.push(docId);
  });
}
function newFolder(parent, docId) {
  commit(docId ? 'Created a folder and moved the document into it. Click the folder to rename it.' : 'Created a folder. Click its name to rename it.', () => {
    const id = 'f' + D.nextFolder++;
    if (docId) { const from = folderOf(docId); if (from) from.docs = from.docs.filter(x => x !== docId); }
    D.folders[id] = { id, name: 'New folder', parent, children: [], docs: docId ? [docId] : [] };
    (parent ? D.folders[parent].children : D.rootFolders).push(id);
    if (!docId) U.nav = { t: 'folder', id };
  });
}
function setField(id, field, value, label) {
  const d = D.docs[id];
  if (d[field] === value) return;
  commit(label || 'Saved.', () => { d[field] = value; if (field === 'name') d.temp = false; });
}

/* ================= Rendering ================= */
const app = $('#app'), tree = $('#tree'), main = $('#main');

function render() {
  renderTree();
  renderMain();
  renderStatus();
  renderAiContext();
}

function renderTree() {
  const on = (t, id) => U.nav.t === t && (!id || U.nav.id === id);
  const cls = (t, id) => on(t, id) ? ' is-active' : '';
  const cur = (t, id) => on(t, id) ? ' aria-current="page"' : '';
  // Second line of a row: status in words, with icons that never carry meaning alone.
  const meta = parts => `<span class="t-meta">${parts.filter(Boolean).join('<span class="t-dot" aria-hidden="true">·</span>')}</span>`;
  const flag = n => n ? `<span class="t-flag">${icon('flag')}${n} to review</span>` : '';
  const docItem = (d, depth = 0) => {
    const done = d.status === 'complete';
    return `
    <button class="t-item t2${cls('doc', d.id)} ${d.temp ? 'is-temp' : ''}"${cur('doc', d.id)} data-nav="doc:${d.id}" draggable="true" data-dragdoc="${d.id}" ${done ? '' : `data-drop="doc:${d.id}"`} style="--d:${depth}" title="${esc(d.name)}${d.temp ? ' (name suggested by Lindley)' : ''}">
      ${icon(done ? 'checkc' : 'doc')}
      <span class="t-txt"><span class="t-name">${esc(d.name)}${d.temp ? '<span class="sr-only"> (name suggested by Lindley)</span>' : ''}</span>
        ${meta([flag(docReview(d)), d.ready && !done ? '<span class="t-ready">Ready</span>' : '', done ? `<span>Completed ${esc(d.exported || '')}</span>` : '', `<span>${plural(d.pages.length, 'page')}</span>`])}</span>
    </button>`;
  };
  const folderItem = (fid, depth = 0) => {
    const f = D.folders[fid];
    const st = folderStats(fid);
    return `<button class="t-item t2${cls('folder', fid)}"${cur('folder', fid)} data-nav="folder:${fid}" data-folderdrop="${fid}" style="--d:${depth}" title="${esc(f.name)}. ${esc(folderSummary(st))}">${icon('folder')}
        <span class="t-txt"><span class="t-name">${esc(f.name)}</span>
        ${meta([flag(st.review), f.children.length ? `<span>${plural(f.children.length, 'subfolder')}</span>` : '', `<span>${plural(st.docs, 'document')}</span>`])}</span></button>`
      + f.children.map(c => folderItem(c, depth + 1)).join('')
      + f.docs.filter(id => D.docs[id]).map(id => docItem(D.docs[id], depth + 1)).join('');
  };
  const section = (key, label, n, inner, drop = '') => {
    const open = !U.closed[key];
    return `<div class="t-sec"><button class="t-sec-h" data-toggle="${key}" ${drop} aria-expanded="${open}">${icon('chev', 'chev')}<span>${label}</span>${n !== '' ? `<span class="count">${n}</span>` : ''}</button><div class="t-list" ${open ? '' : 'hidden'}>${inner}</div></div>`;
  };
  const prog = docsBy('progress').filter(d => !folderOf(d.id));
  const done = docsBy('complete').filter(d => !folderOf(d.id));
  const rv = reviewQueue().length;
  tree.innerHTML = `
    <button class="t-item t-inbox${cls('inbox')}"${cur('inbox')} data-nav="inbox" data-drop="inbox">${icon('inbox')}<span class="t-name">Inbox</span><span class="count strong"><span class="sr-only">, </span>${D.inbox.length}<span class="sr-only"> scans</span></span></button>
    <button class="t-item t-review${cls('review')}"${cur('review')} data-nav="review">${icon(rv ? 'flag' : 'checkc')}<span class="t-name">Needs your review</span><span class="count strong"><span class="sr-only">, </span>${rv}<span class="sr-only"> pages</span></span></button>
    ${section('progress', 'In progress', prog.length, prog.map(d => docItem(d)).join('') || '<p class="count" style="padding:4px 12px">Nothing in progress</p>', 'data-unfile')}
    ${section('complete', 'Completed', done.length, done.map(d => docItem(d)).join('') || '<p class="count" style="padding:4px 12px">Nothing here</p>', 'data-unfile')}
    <button class="t-item${cls('aside')}"${cur('aside')} data-nav="aside" data-drop="aside" style="margin-top:10px">${icon('aside')}<span class="t-name">Set aside</span><span class="count"><span class="sr-only">, </span>${D.aside.length}<span class="sr-only"> scans</span></span></button>
    ${section('folders', 'My folders', '', D.rootFolders.map(f => folderItem(f)).join('') + `<button class="t-add" data-act="newFolder">${icon('plus')} New folder</button>`)}
    <div class="legend">
      <span>${icon('flag')} Pages that need your review</span>
      <span>${icon('checkc')} Completed and exported</span>
      <span><i>Italic names</i> were suggested by Lindley</span>
    </div>`;
}

function renderStatus() {
  const reading = D.inbox.filter(id => D.scans[id].status === 'reading').length;
  $('#status').innerHTML = `
    <span class="hide-narrow">${icon('eye')} Watching 2 folders: <span class="mono">D:\\Scans\\Attic box 4</span>,&nbsp;<span class="mono">D:\\Scans\\Courthouse</span></span>
    <span><i class="dot ${reading ? 'busy' : ''}"></i>${reading ? `Reading ${plural(reading, 'new scan')}` : 'All scans read'}</span>
    ${reviewQueue().length ? `<button data-nav="review">${icon('flag')} ${plural(reviewQueue().length, 'page')} to review</button>` : ''}
    <span class="hide-narrow">Sample data. Changes are not saved.</span>`;
}

function confChip(s) {
  if (s.status === 'reading') return '<span class="conf reading">Reading…</span>';
  const how = s.engine === 'vision' ? 'AI' : 'OCR';
  const long = `${s.engine === 'vision' ? 'Read by the AI vision model' : 'Read by Tesseract OCR'}, ${s.conf}% confident`;
  if (s.reviewed) return `<span class="conf mine" title="${long}. You checked the text.">${icon('check')}Checked</span>`;
  if (needsReview(s)) return `<span class="conf flag" title="${long}. Lindley needs you to check this page.">${icon('flag')}Review · ${how} ${s.conf}%</span>`;
  return `<span class="conf" title="${long}">${how} ${s.conf}%</span>`;
}
function card(id, i, o) {
  const s = D.scans[id];
  const a = angle(s);
  const hintDoc = o.hints && s.hint && D.docs[s.hint];
  const label = o.numbered ? `Page ${i + 1}` : s.file;
  const sel = U.sel.has(id);
  return `<div class="pg ${sel ? 'is-sel' : ''}" data-pg="${id}" draggable="true" role="listitem">
    <button class="pg-main" data-pgsel aria-pressed="${sel}">
      <span class="pg-img"><img src="${pageImg(id)}" alt="" style="${rotStyle(s)}" draggable="false"></span>
      <span class="pg-check" data-check aria-hidden="true">${icon('check')}</span>
      ${a ? `<span class="pg-flag">${icon('rotR')}Sideways?</span>` : ''}
      <span class="pg-f"><span class="pg-lbl ${o.numbered ? '' : 'mono'}">${label}</span>${confChip(s)}</span>
    </button>
    ${hintDoc ? `<button class="pg-hint" data-place="${id}:${hintDoc.id}" title="Lindley thinks this belongs in “${esc(hintDoc.name)}”">${lic()}<span>Add to “${esc(shortName(hintDoc.name))}”</span></button>` : ''}
  </div>`;
}
function grid(ids, o = {}) {
  if (!ids.length) return `<div class="empty">${o.empty || 'Nothing here.'}</div>`;
  return `<div class="grid" id="grid" role="list" aria-label="Pages. Click to select, Ctrl or Shift to select more." style="--thumb:${U.thumb}px">${ids.map((id, i) => card(id, i, o)).join('')}</div>`;
}
function tbBtn(ic, label, act, dis, cls = '') {
  return `<button class="btn ${cls}" data-act="${act}" ${dis ? 'disabled' : ''} title="${label}">${icon(ic)}<span class="lbl">${label}</span></button>`;
}
function icoBtn(ic, label, act, dis) {
  return `<button class="btn ico" data-act="${act}" ${dis ? 'disabled' : ''} title="${label}" aria-label="${label}">${icon(ic)}</button>`;
}
function sizeCtl() {
  return `<label class="desktop-only">Size <input id="thumb" type="range" min="110" max="260" step="10" value="${U.thumb}" aria-label="Thumbnail size"></label>`;
}
const SEP = '<span class="sep" aria-hidden="true"></span>';
const selLabel = (n, one) => `<span class="dock-sel">${one || (n ? `${n} selected` : 'None selected')}</span>`;
const rotBtns = n => icoBtn('rotL', 'Rotate left', 'rotL', !n) + icoBtn('rotR', 'Rotate right', 'rotR', !n);
// One floating toolbar per view holds every action for what you're looking at.
function dock() {
  const t = U.nav.t, n = targets().length, d = curDoc();
  let name = 'Actions', inner = '';
  if (t === 'doc') {
    name = 'Document actions';
    const one = (U.view === 'reader' || U.view === 'side') && d.pages.length ? `Page ${U.cur + 1}` : '';
    inner = tbBtn('lindley', 'Ask Lindley', 'askDoc', false, 'ai') + tbBtn('folder', 'Move to folder…', 'folderMenu');
    if (d.status === 'complete') inner += tbBtn('back', 'Reopen for changes', 'reopen');
    else inner += tbBtn('pdf', 'Export PDF', 'export', false, 'primary') + SEP + selLabel(n, one) + rotBtns(n)
      + icoBtn('up', 'Move earlier', 'up', !n) + icoBtn('down', 'Move later', 'down', !n) + tbBtn('more', 'More…', 'pageMore', !n);
  } else if (t === 'inbox') {
    name = 'Inbox actions';
    inner = tbBtn('lindley', 'Ask Lindley', 'askInbox', false, 'ai') + SEP + selLabel(n) + rotBtns(n)
      + tbBtn('newdoc', 'New document…', 'newDoc', !n) + tbBtn('move', 'Add to document…', 'moveMenu', !n) + tbBtn('aside', 'Set aside', 'aside', !n);
  } else if (t === 'aside') {
    inner = selLabel(n) + rotBtns(n) + tbBtn('inbox', 'Return to Inbox', 'inbox', !n) + tbBtn('move', 'Add to document…', 'moveMenu', !n);
  } else if (t === 'folder') {
    inner = tbBtn('plus', 'New subfolder', 'newSubfolder') + tbBtn('lindley', 'Ask Lindley', 'askFolder', false, 'ai');
  } else if (t === 'search') {
    inner = tbBtn('lindley', 'Ask Lindley about these', 'askSearch', false, 'ai');
  } else if (t === 'review' && !U.nav.id) {
    const q = reviewQueue().length;
    inner = (q ? tbBtn('flag', `Start reviewing all ${q}`, 'startReview', false, 'primary') : '') + tbBtn('lindley', 'Ask Lindley', 'askReview', false, 'ai');
  } else if (t === 'review') {
    const q = listIds().length;
    if (!q) return '';
    name = 'Move between pages to review';
    // The review's main actions sit in the dock, next to the page-to-page navigation.
    inner = tbBtn('prev', 'Previous', 'prev', U.cur === 0) + SEP
      + tbBtn('check', 'The text is correct', 'confirmTx', false, 'primary') + tbBtn('pen', 'Save my correction', 'saveTx') + SEP
      + `<span class="dock-prog"><span>Page ${U.cur + 1} of ${q} to review</span><b style="--v:${Math.round((U.cur + 1) / q * 100)}%" aria-hidden="true"></b></span>`
      + tbBtn('chev', 'Next', 'next', U.cur >= q - 1, 'next');
  } else if (t === 'scan') {
    const aside = locate(U.nav.id)?.where === 'aside';
    inner = tbBtn('back', aside ? 'Back to Set aside' : 'Back to Inbox', 'backHome') + SEP + rotBtns(1)
      + tbBtn('newdoc', 'New document…', 'newDoc') + tbBtn('move', 'Add to document…', 'moveMenu')
      + (aside ? tbBtn('inbox', 'Return to Inbox', 'inbox') : tbBtn('aside', 'Set aside', 'aside')) + tbBtn('lindley', 'Ask Lindley', 'askScan', false, 'ai');
  }
  return inner ? `<div class="dock-wrap"><div class="dock" role="toolbar" aria-label="${name}">${inner}</div></div>` : '';
}

function renderMain() {
  const sc = $('.scroll', main)?.scrollTop || 0;
  // Keep keyboard focus on the dock button that was used, since the view re-renders.
  const fa = document.activeElement;
  const act = fa?.closest?.('.dock') ? fa.dataset.act : null;
  const views = { inbox: viewInbox, aside: viewAside, doc: viewDoc, folder: viewFolder, search: viewSearch, scan: viewScan, review: () => U.nav.id ? viewReview() : viewReviewList() };
  const dk = dock();
  main.innerHTML = views[U.nav.t]() + dk;
  main.classList.toggle('has-dock', !!dk);
  const s = $('.scroll', main);
  if (s) s.scrollTop = sc;
  if (act) ($(`.dock [data-act="${act}"]:not(:disabled)`, main) || $('.dock button:not(:disabled)', main))?.focus();
}

function viewInbox() {
  const hints = D.inbox.filter(id => D.scans[id].hint).length;
  return `
  <div class="head">
    <div class="crumbs">Inbox</div>
    <div class="title-row"><h1 class="title">${plural(D.inbox.length, 'scan')} waiting</h1></div>

    ${hints ? `<div class="banner ai">${lic()}<div><b>Lindley found ${plural(hints, 'scan')} that probably belong to documents in progress.</b> Look for the suggestion under each page.</div><button class="btn" data-act="sortMatch">Show them first</button></div>` : ''}
    <div class="viewbar"><label>Sort <select id="sort"><option value="new" ${U.sort === 'new' ? 'selected' : ''}>Newest scans first</option><option value="old" ${U.sort === 'old' ? 'selected' : ''}>Oldest scans first</option><option value="match" ${U.sort === 'match' ? 'selected' : ''}>Suggested matches first</option></select></label>${sizeCtl()}</div>
  </div>

function viewAside() {
  return `
  <div class="head">
    <div class="crumbs">Set aside</div>
    <div class="title-row"><h1 class="title">Set aside</h1></div>
    <p class="sub">Receipts, blank pages, sticky notes and other scans that aren't part of a document. Nothing here is deleted. Return a scan to the Inbox if it was set aside by mistake.</p>
    <div class="viewbar">${sizeCtl()}</div>
  </div>
  <div class="scroll">${grid(D.aside, { empty: 'Nothing has been set aside.' })}</div>`;
}

function viewDoc() {
  const d = curDoc();
  const done = d.status === 'complete';
  const f = folderOf(d.id);
  const inboxMatches = D.inbox.filter(id => D.scans[id].hint === d.id);
  const rv = docReview(d);
  const tabs = [['grid', 'Pages'], ['reader', 'Reader'], ['side', 'Scan and text']];
  const crumbs = f ? ['My folders', ...folderPath(f.id)] : [done ? 'Completed' : 'In progress'];

  let banners = '';
  if (done) banners += `<div class="banner ok">${icon('checkc')}<div><b>Completed ${esc(d.exported || '')}.</b> Exported as a searchable PDF: <span class="mono">${esc(d.name)}.pdf</span></div></div>`;
  else {
    if (rv) banners += `<div class="banner review">${icon('flag')}<div><b>${plural(rv, 'page')} ${rv === 1 ? 'needs' : 'need'} your review.</b> Lindley isn't sure it read ${rv === 1 ? 'it' : 'them'} correctly.</div><button class="btn" data-act="reviewDoc">Review next</button></div>`;
    if (d.ready) banners += `<div class="banner ok">${icon('checkc')}<div><b>Lindley thinks this document is complete.</b> ${esc(d.missing || '')} ${rv ? 'Review the flagged pages first, then export it.' : "Look it over, then export it when you're ready."}</div><button class="btn" data-act="export">Review and export</button><button class="btn ghost" data-act="notReady">Not yet</button></div>`;
    if (d.note) banners += `<div class="banner warn">${icon('warn')}<div>${esc(d.note.text)}</div><button class="btn" data-act="fixOrder">${esc(d.note.fix)}</button><button class="btn ghost" data-act="dismissNote">Leave as is</button></div>`;
    if (inboxMatches.length) banners += `<div class="banner ai">${lic()}<div>Lindley thinks ${plural(inboxMatches.length, 'scan')} in your Inbox might belong here.</div><button class="btn" data-act="addMatches">Add ${inboxMatches.length === 1 ? 'it' : 'them'}</button><button class="btn ghost" data-act="showMatches">Show me first</button></div>`;
  }

  let body = '';
  if (U.view === 'grid') body = `<div class="scroll">${grid(d.pages, { numbered: true, empty: 'This document has no pages.' })}</div>`;
  else if (U.view === 'reader') body = viewReader(d);
  else body = viewSide(d, done);

  return `
  <div class="head">
    <div class="crumbs">${crumbs.map(esc).join(' › ')}</div>
    <div class="title-row">
      <h1 class="sr-only">${esc(d.name)}</h1>
      <input id="doc-title" class="title-in ${d.temp ? 'is-temp' : ''}" value="${esc(d.name)}" aria-label="Document name" ${done ? 'readonly' : ''}>
    </div>
    <div class="meta">
      ${d.temp ? `<span class="chip ai">${lic()} Name suggested by Lindley. Click it to rename.</span>` : ''}
      <span class="chip">${plural(d.pages.length, 'page')}</span>
      ${d.type ? `<span class="chip">${esc(d.type)}</span>` : ''}
      ${d.date ? `<span class="chip">${esc(d.date)}</span>` : ''}
      ${done ? '' : `<span class="meter" title="How sure Lindley is that these pages belong together">Grouping confidence <b style="--v:${d.conf}%" aria-hidden="true"></b> ${d.conf}%</span>`}
    </div>
    ${banners}
    <div class="tabrow">
      <div class="tabs" role="tablist" aria-label="Views">${tabs.map(([k, l]) => `<button class="tab" role="tab" data-view="${k}" aria-selected="${U.view === k}" tabindex="${U.view === k ? 0 : -1}">${l}</button>`).join('')}</div>
      ${U.view === 'grid' && !done ? `<div class="viewbar"><button class="btn ghost" data-act="selAll">${U.sel.size === d.pages.length ? 'Clear selection' : 'Select all'}</button>${sizeCtl()}</div>` : ''}
    </div>
  </div>
  ${body}`;
}

function pager(n, what = 'Page') {
  return `<button class="icon-btn" data-act="prev" ${U.cur === 0 ? 'disabled' : ''} aria-label="Previous">${icon('prev')}</button>
    <span>${what} ${U.cur + 1} of ${n}</span>
    <button class="icon-btn" data-act="next" ${U.cur >= n - 1 ? 'disabled' : ''} aria-label="Next">${icon('chev')}</button>`;
}
function viewReader(d) {
  if (!d.pages.length) return '<div class="empty">This document has no pages.</div>';
  const s = D.scans[d.pages[U.cur]];
  return `<div class="reader" style="min-height:0;flex:1">
    <div class="rd-bar">${pager(d.pages.length)}<span class="sep" style="width:1px;height:18px;background:var(--line);margin:0 6px"></span>

function searchScans(q) {

    const i = t.toLowerCase().indexOf(ql);

    const l = locate(s.id);
    if (!l) return;
    const a = Math.max(0, i - 60), b = Math.min(t.length, i + q.length + 80);
    const snip = (a ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length, b)) + (b < t.length ? '…' : '');

  });

const AFN = [];

    const term = m ? m[1].replace(/^(the name|name)\s+/, '') : 'Branson';
    const words = term.split(/\s+/);

    if (!res.length && words.length > 1) res = searchScans(words[words.length - 1]);
    if (!res.length) { pushMsg('ai', `<p>I couldn't find “${esc(term)}” on any page. Handwriting is sometimes read loosely, so try a surname on its own.</p>`); return; }
    const byDoc = new Map();
    res.forEach(r => { const k = r.l.where === 'doc' ? r.l.doc.id : r.s.id; if (!byDoc.has(k)) byDoc.set(k, r); });
    const top = [...byDoc.values()].slice(0, 6);
    pushMsg('ai', `<p>I found “${esc(term)}” on ${plural(res.length, 'page')}, in ${plural(byDoc.size, 'place')}. The first few:</p><ul>${top.map(r => `<li>${whereLabel(r)}</li>`).join('')}</ul>`,
      [...top.slice(0, 4).map(r => ({ label: 'Open ' + (r.l.where === 'doc' ? shortName(r.l.doc.name) : r.s.file), fn: () => openScan(r.s.id) })),
        { label: 'See all results', fn: () => { U.q = term; $('#search-q').value = term; go({ t: 'search' }); } }]);
    return;
  }
  if (/place|belong|sort|which inbox/.test(ql)) {
    const h = D.inbox.filter(id => D.scans[id].hint);
    if (!h.length) { pushMsg('ai', '<p>I can\'t place any more Inbox scans with confidence right now. As new scans arrive I\'ll check them against your documents.</p>'); return; }
    pushMsg('ai', `<p>I think ${plural(h.length, 'scan')} in the Inbox belong to documents in progress:</p><ul>${h.map(id => `<li><span class="mono">${D.scans[id].file}</span> → ${esc(D.docs[D.scans[id].hint].name)}</li>`).join('')}</ul><p>The other scans don't match anything yet. Some are receipts and blank pages that could be set aside.</p>`,
      [{ label: `Add all ${h.length}`, fn: () => { const g = {}; h.forEach(id => (g[D.scans[id].hint] ||= []).push(id)); commit(`Added ${plural(h.length, 'scan')} to their documents.`, () => { Object.entries(g).forEach(([doc, ids]) => ids.forEach(id => { detach(id); D.docs[doc].pages.push(id); D.scans[id].hint = null; })); }); } },

    const by = new Map();

    pushMsg('ai', `<p>I'm not confident I read ${plural(q.length, 'page')} correctly:</p><ul>${[...by].map(([k, n]) => `<li>${esc(k)}: ${plural(n, 'page')}</li>`).join('')}</ul><p>Most are handwriting with a word or two I couldn't make out. Each check takes about a minute.</p>`,
      [{ label: 'Start reviewing', fn: () => go({ t: 'review' }) }]);
    return;
  }
  if (pageId && /this page|page say|say\b|read/.test(ql)) {
    const s = D.scans[pageId];
    const t = s.text.replace(/[{}]/g, '').replace(/\n+/g, ' ');
    pushMsg('ai', `<p>This page reads:</p><p><q>${esc(t.length > 320 ? t.slice(0, 320) + '…' : t)}</q></p>${needsReview(s) ? '<p>I wasn\'t sure of the highlighted words, so please check them against the scan.</p>' : ''}`);
    return;
  }
  if (U.nav.t === 'folder' && /folder/.test(ql)) {
    pushMsg('ai', `<p>${esc(D.folders[U.nav.id].name)} holds ${esc(folderSummary(folderStats(U.nav.id)))}.</p><p>Open any document and I can summarize it or check it for missing pages.</p>`);
    return;
  }

  if (/date|when|dated|year/.test(ql)) { pushMsg('ai', `<p>${esc(d.dateWhy || 'I haven\'t found a date on these pages yet.')}</p>`); return; }

function askAbout(ids) {

    const now = Date.now();

    items[j]?.focus();

  }
  // Arrow keys move along the dock, as in any toolbar.
  if (e.target.closest?.('.dock') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    const items = $$('.dock button:not(:disabled)', main);

  // Keep Tab inside the open dialog.

    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  const typing = e.target.closest('input, textarea, select, [contenteditable="true"]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  if (!typing && !e.target.matches('.tab') && (U.nav.t === 'doc' || U.nav.t === 'review') && curScan()) {

$('#ai-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#ai-form').requestSubmit(); } });
$('#ai-pop').addEventListener('click', () => {
  if (U.ai === 'float') U.ai = 'dock';
  else {
    const r = app.getBoundingClientRect();
    U.aiPos = { x: Math.max(12, r.width - 400), y: 70 };
    U.ai = 'float';
  }
  syncAi();
});
$('#ai-close').addEventListener('click', () => {
  if (matchMedia('(max-width: 860px)').matches) { app.classList.remove('show-ai'); syncScrim(); return; }
  U.ai = 'collapsed'; syncAi();
});
rail.addEventListener('click', () => { U.ai = 'dock'; syncAi(); });
$('#ai-toggle').addEventListener('click', () => { app.classList.toggle('show-ai'); app.classList.remove('show-tree'); if (U.ai === 'collapsed') { U.ai = 'dock'; syncAi(); } syncScrim(); });
$('#tree-toggle').addEventListener('click', () => { app.classList.toggle('show-tree'); app.classList.remove('show-ai'); syncScrim(); });
scrim.addEventListener('click', () => { if (!modal.hidden) closeModal(); app.classList.remove('show-tree', 'show-ai'); syncScrim(); });

/* Dragging the floating AI window by its header */
$('#ai-h').addEventListener('pointerdown', e => {
  if (U.ai !== 'float' || e.target.closest('button') || matchMedia('(max-width: 860px)').matches) return;
  const ar = app.getBoundingClientRect(), r = ai.getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  $('#ai-h').setPointerCapture(e.pointerId);
  const mv = ev => {
    U.aiPos.x = Math.max(0, Math.min(ev.clientX - ar.left - ox, ar.width - r.width));
    U.aiPos.y = Math.max(0, Math.min(ev.clientY - ar.top - oy, ar.height - 60));
    ai.style.left = U.aiPos.x + 'px'; ai.style.top = U.aiPos.y + 'px';
  };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
});

/* Theme */
function effectiveTheme() { return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function syncThemeBtn() { $('#theme-btn').innerHTML = icon(effectiveTheme() === 'dark' ? 'sun' : 'moon'); }
$('#theme-btn').addEventListener('click', () => { document.documentElement.dataset.theme = effectiveTheme() === 'dark' ? 'light' : 'dark'; syncThemeBtn(); });

/* Simulated background reading of new scans */
setInterval(() => {
  const id = D.inbox.find(x => D.scans[x].status === 'reading');
  if (!id) return;
  const s = D.scans[id];
  s.status = 'read';
  s.conf = s.engine === 'vision' ? 80 + Math.floor(Math.random() * 18) : 90 + Math.floor(Math.random() * 9);
  renderTree(); renderStatus();
  if (U.nav.t === 'inbox') renderMain();
}, 6000);

/* ================= Boot ================= */
function boot() {
  D = buildData();
  U = { nav: { t: 'doc', id: 'd1' }, view: 'grid', sel: new Set(), anchor: null, cur: 0, zoom: 1, closed: {}, ai: 'dock', aiPos: { x: 0, y: 70 }, q: '', sort: 'new', thumb: 150 };
  $('#tree-toggle').innerHTML = icon('menu');
  document.documentElement.lang = 'en';
  $('#ai-toggle').innerHTML = lic();
  $('#ai-spark').innerHTML = lic();
  $('#rail-ic').innerHTML = lic();
  $('#ai-close').innerHTML = icon('close');
  $('#ai-send').innerHTML = icon('send');
  syncThemeBtn();
  syncAi();
  render();
  pushMsg('ai', '<p>Hello, I\'m Lindley. I can tell you about the document you have open, check whether pages are missing, or find every page that mentions a name.</p><p>When I\'m not sure I read a page correctly, I flag it for your review instead of guessing quietly. Pages like that are marked Review.</p>');
}
const fontsReady = Promise.all(['19px "Homemade Apple"', '18px "IM Fell English"', '16px "Special Elite"', '14px "IBM Plex Mono"'].map(f => document.fonts.load(f).catch(() => null)));
Promise.race([fontsReady, new Promise(r => setTimeout(r, 3000))]).then(boot);
})();
</script>
