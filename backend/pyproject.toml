[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lindley"
version = "0.1.0"
description = "Turn scanned archives into searchable PDFs and chat with your documents."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.20",  # Add scans…: files uploaded from the app
    "pydantic>=2.8",
    "platformdirs>=4.0",
    "watchdog>=5.0",
    "pypdfium2>=4.30",
    "Pillow>=10.4",
    "fpdf2>=2.8,<3",  # searchable PDFs, written from Lindley's own readings
    "keyring>=25",
    # Each AI through its company's own library
    "anthropic>=1.11,<2",
    "openai>=3.24,<4",
    "google-genai>=2.28,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI's TestClient, and the Google connector's made-up server
    "httpx2>=2.0",  # the Anthropic and OpenAI connectors' made-up servers
]

[project.scripts]
lindley = "lindley.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lindley = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
