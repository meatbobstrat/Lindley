[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lindley"
version = "0.1.0"
description = "Lindley – Historical document intake, processing, and AI archivist"
authors = [
    { name = "Bob Stratton", email = "bob@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "watchdog==4.0.1",
    "loguru==0.7.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lindley*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=lindley --cov-report=term-missing --cov-report=html"

[project.scripts]
lindley-intake = "lindley.watcher.watcher:main"
lindley-worker = "lindley.worker.worker:main"
lindley-ai     = "lindley.AI.__init__:main"
