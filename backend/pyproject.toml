[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lindley"
version = "0.1.0"
description = "Turn scanned archives into searchable PDFs and chat with your documents."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "platformdirs>=4.0",
    "watchdog>=5.0",
    "ocrmypdf>=16.0",
    "pypdf>=5.0",
    "Pillow>=10.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
lindley = "lindley.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lindley = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
