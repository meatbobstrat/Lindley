<meta charset="utf-8">
<title>Lindley Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Homemade+Apple&family=IM+Fell+English&family=Special+Elite&display=swap">
<style>
:root {
  --bg: #E3E7E1;
  --surface: #F7F8F5;
  --panel: #EDF0EA;
  --raise: #FFFFFF;
  --line: #D2D8D0;
  --line-strong: #B9C2B7;
  --ink: #1B2420;
  --muted: #56635C;
  --faint: #66716B;
  --field: #7C8781;
  --accent: #2A4F86;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE5F3;
  --ai: #8A5A00;
  --ai-soft: #F6ECD6;
  --ok: #2F7A47;
  --ok-soft: #DCEFE2;
  --warn: #9A5606;
  --warn-soft: #F8E7CF;
  --stage: #D5DAD3;
  --shadow: 0 1px 2px rgba(20, 30, 25, .08), 0 8px 24px rgba(20, 30, 25, .10);
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1211; --surface: #161B19; --panel: #1A201E; --raise: #212825;
    --line: #2C3531; --line-strong: #3C4742; --ink: #E2E8E4; --muted: #9DA8A2; --faint: #8A958F; --field: #74807A;
    --accent: #8FB1EA; --accent-ink: #0E1211; --accent-soft: #22314A;
    --ai: #E2B45E; --ai-soft: #36291A; --ok: #7FC794; --ok-soft: #1C3325;
    --warn: #E6A75C; --warn-soft: #3A2A16; --stage: #0F1312;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1211; --surface: #161B19; --panel: #1A201E; --raise: #212825;
  --line: #2C3531; --line-strong: #3C4742; --ink: #E2E8E4; --muted: #9DA8A2; --faint: #8A958F; --field: #74807A;
  --accent: #8FB1EA; --accent-ink: #0E1211; --accent-soft: #22314A;
  --ai: #E2B45E; --ai-soft: #36291A; --ok: #7FC794; --ok-soft: #1C3325;
  --warn: #E6A75C; --warn-soft: #3A2A16; --stage: #0F1312;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 12px;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
/* The Lindley mark: one shape that always means "this gets you Lindley, the AI". */
.lic { width: var(--lic-size, 20px); height: var(--lic-size, 20px); flex: none; color: var(--ai); }

/* ---------- App frame ---------- */
.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr) auto;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.top {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: .01em; min-width: 0; }
.brand .lic { --lic-size: 28px; }
.search { flex: 1; max-width: 520px; position: relative; }
.search input {
  width: 100%; padding: 7px 10px 7px 34px;
  border: 1px solid var(--field); border-radius: 6px; background: var(--raise);
}
.search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.spacer { flex: 1; }
.sample { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line-strong); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--muted); }
.icon-btn:hover { background: var(--panel); color: var(--ink); }
.mobile-only { display: none; }

/* ---------- Tree ---------- */
.tree {
  grid-row: 2; grid-column: 1;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px 8px 16px;
  display: flex; flex-direction: column; gap: 1px;
}
.t-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 5px 8px 5px calc(8px + var(--d, 0) * 14px);
  border: 1px solid transparent; border-radius: 6px; background: none; text-align: left;
}
.t-item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.t-item.is-active { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); font-weight: 500; }
.t-item.is-active > .ic { color: var(--accent); }
.t-item.is-drop { border-color: var(--accent); border-style: dashed; background: var(--accent-soft); }
.t-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-item.is-temp .t-name { font-style: italic; }
.t-item.t2 { align-items: flex-start; padding-block: 4px; }
.t-item.t2 > .ic { margin-top: 1px; }
.t-txt { flex: 1; min-width: 0; display: grid; }
.t2 .t-name { font-size: 13.5px; line-height: 1.35; }
.t-meta { display: flex; flex-wrap: wrap; align-items: center; column-gap: 5px; font-size: 12px; line-height: 1.45; color: var(--muted); font-weight: 400; }
.t-dot { color: var(--muted); }
.count { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.count.strong { font-weight: 600; color: var(--ink); background: var(--raise); border: 1px solid var(--line); padding: 0 7px; border-radius: 999px; }
.t-inbox { font-weight: 600; padding-block: 8px; }
.t-sec { margin-top: 10px; }
.t-sec-h {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 4px 8px; border: 0; background: none;
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-radius: 6px;
}
.t-sec-h.is-drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.t-sec-h .chev { width: 14px; height: 14px; transition: transform .15s; }
.t-sec-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.t-list { display: flex; flex-direction: column; gap: 1px; }
.t-ready { font-size: 12px; font-weight: 600; color: var(--ink); border: 1px solid var(--field); padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.t-flag, .f-meta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-flag { color: var(--ink); font-weight: 600; }
.t-flag .ic, .f-meta .ic { width: 14px; height: 14px; }
.t-review { font-weight: 600; }
.t-review .count.strong { border-color: var(--field); }
.t-add { display: flex; align-items: center; gap: 6px; margin: 4px 0 0 8px; padding: 4px 8px; border: 0; background: none; color: var(--muted); font-size: 13px; }
.t-add:hover { color: var(--accent); }
.t-add .ic { width: 15px; height: 15px; }
.legend { margin-top: auto; padding: 12px 8px 0; font-size: 12px; color: var(--muted); display: grid; gap: 5px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend .ic { width: 15px; height: 15px; color: var(--ink); }
.legend .lic { --lic-size: 16px; }

/* ---------- Main ---------- */
.main { position: relative; container-type: inline-size; grid-row: 2; grid-column: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 14px 20px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.crumbs { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title-in {
  flex: 1 1 280px; min-width: 0;
  font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.2;
  padding: 2px 6px; margin-left: -6px; border: 1px solid transparent; border-radius: 6px; background: none;
}
.title-in:hover:not([readonly]) { border-color: var(--field); }
.title-in:focus { border-color: var(--accent); background: var(--raise); outline: none; }
.title-in.is-temp { font-style: italic; }
h1.title { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.2; flex: 1 1 280px; text-wrap: balance; }
.sub { margin: 0 0 4px; color: var(--muted); max-width: 70ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 6px;
  border: 1px solid var(--line-strong); background: var(--raise); white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ai { border-color: var(--ai); color: var(--ink); background: var(--ai-soft); font-weight: 500; }
.btn.ai:hover:not(:disabled) { color: var(--ink); }
.btn.ask { padding: 6px 14px 6px 10px; font-size: 15px; }
.btn.ask .lic { --lic-size: 22px; }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn .ic { width: 16px; height: 16px; }
.btn .lic { --lic-size: 18px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
.chip.ai { background: var(--ai-soft); border-color: transparent; color: var(--ink); }
.chip .ic { width: 14px; height: 14px; }
.chip .lic { --lic-size: 14px; }
.meter { display: inline-flex; align-items: center; gap: 6px; }
.meter b { display: inline-block; width: 54px; height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.meter b { border: 1px solid var(--field); height: 7px; }
.meter b::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--ink); }
.banner { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.banner > .ic, .banner > .lic { margin-top: 3px; }
.b-body { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.b-text { flex: 0 1 auto; max-width: 75ch; }
.b-acts { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.banner.ok { background: var(--ok-soft); }
.banner.ok > .ic { color: var(--ok); }
.banner.warn { background: var(--warn-soft); }
.banner.warn > .ic { color: var(--warn); }
.banner.ai { background: var(--ai-soft); }
.banner.review { background: var(--warn-soft); }
.banner.review > .ic { color: var(--warn); }
.banner .btn { padding: 4px 10px; font-size: 13px; }
.tabs { display: flex; gap: 2px; margin-top: 2px; overflow-x: auto; }
.tab { padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }

.viewbar { display: flex; align-items: center; justify-content: flex-end; gap: 14px; flex-wrap: wrap; padding: 0 0 8px; font-size: 12px; color: var(--muted); }
.viewbar label { display: inline-flex; align-items: center; gap: 6px; }
.viewbar select { padding: 3px 6px; border: 1px solid var(--field); border-radius: 6px; background: var(--raise); font-size: 13px; }
.viewbar .btn { padding: 3px 10px; font-size: 13px; }
.tabrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tabrow .viewbar { padding-bottom: 6px; }
.crumb { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; font-size: 12px; }

/* The action dock floats centered over the content, close to where you are looking. */
.dock-wrap { position: absolute; left: 12px; right: 12px; bottom: 14px; z-index: 20; display: flex; justify-content: center; pointer-events: none; }
.dock {
  pointer-events: auto; display: flex; align-items: center; gap: 2px; max-width: 100%; overflow-x: auto;
  padding: 6px; border: 1px solid var(--field); border-radius: 14px; background: var(--raise); box-shadow: var(--shadow);
}
.dock .btn { flex: none; padding: 7px 11px; border-color: transparent; background: none; font-size: 14px; }
.dock .btn:hover:not(:disabled) { background: var(--panel); border-color: var(--line); color: var(--ink); }
.dock .btn.ico { padding: 7px; }
.dock .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dock .btn.primary:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); filter: brightness(1.08); }
.dock .btn.ai { background: var(--ai-soft); border-color: var(--ai); }
.btn.next { flex-direction: row-reverse; }
.dock .sep { flex: none; width: 1px; align-self: stretch; margin: 4px 6px; background: var(--line); }
.dock-sel { flex: none; padding: 0 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dock-prog { flex: none; display: grid; justify-items: center; gap: 4px; padding: 0 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
.dock-prog b { width: 160px; height: 7px; border-radius: 4px; border: 1px solid var(--field); position: relative; overflow: hidden; }
.dock-prog b::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--ink); }
.dock-hint { flex: none; padding: 0 8px; font-size: 12px; color: var(--muted); }
.main.has-dock .grid, .main.has-dock .docs, .main.has-dock .results, .main.has-dock .empty, .main.has-dock .rv-done { padding-bottom: 96px; }
/* Lists of sections leave room for the dock once, at the end, not under every section */
.main.has-dock .dup-list .docs, .main.has-dock .na-list .docs { padding-bottom: 0; }
.main.has-dock .dup-list, .main.has-dock .na-list { padding-bottom: 96px; }
.main.has-dock .side-tx, .main.has-dock .side-img { padding-bottom: 90px; }
.main.has-dock .reader .strip { padding-bottom: 84px; }
.main.file-drop { outline: 3px dashed var(--accent); outline-offset: -6px; }
.dock-wrap.free { right: auto; bottom: auto; }
.dock-grip { flex: none; display: grid; place-items: center; width: 22px; align-self: stretch; margin-right: 2px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: grab; touch-action: none; }
.dock-grip:hover { background: var(--panel); color: var(--ink); }
.dock-grip .ic { width: 16px; height: 16px; stroke-width: 3.2; }
.dock.dragging { cursor: grabbing; box-shadow: 0 4px 10px rgba(20, 30, 25, .18), 0 18px 40px rgba(20, 30, 25, .22); }
/* When the dock would overflow, secondary buttons drop their text (keeping tooltips and accessible names). */
.dock.compact .btn:not(.ai):not(.primary):not(.keep) .lbl, .dock.tiny .btn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dock.compact .btn:not(.ai):not(.primary):not(.keep), .dock.tiny .btn { padding: 7px; }
.dock.tiny .dock-prog b { width: 80px; }

.scroll { flex: 1; overflow: auto; min-height: 0; }

/* Page grid */
.grid { --thumb: 150px; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--thumb), 1fr)); gap: 16px; padding: 18px 20px 28px; align-content: start; }
.pg { position: relative; display: flex; flex-direction: column; gap: 6px; border-radius: 8px; padding: 6px; border: 2px solid transparent; user-select: none; }
.pg:hover { background: var(--panel); }
.pg-main { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; text-align: left; border-radius: 4px; }
.pg-main:focus-visible { outline-offset: 4px; }
.pg.is-sel { border-color: var(--accent); background: var(--accent-soft); }
.pg.drop-before { box-shadow: -6px 0 0 -2px var(--accent); }
.pg.drop-after { box-shadow: 6px 0 0 -2px var(--accent); }
.pg.is-dragging { opacity: .4; }
.pg-img { aspect-ratio: 3 / 4; display: grid; place-items: center; overflow: hidden; border-radius: 3px; background: var(--stage); }
.pg-img img, .rot { transform: rotate(var(--r, 0deg)) scale(var(--s, 1)); transition: transform .25s ease; }
.pg-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pg-check {
  position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 5px;
  display: grid; place-items: center; background: var(--raise); border: 1px solid var(--field); opacity: 0; color: var(--accent-ink);
}
.pg:hover .pg-check, .pg.is-sel .pg-check, .pg-main:focus-visible .pg-check { opacity: 1; }
.pg.is-sel .pg-check { background: var(--accent); border-color: var(--accent); }
.pg-check .ic { width: 14px; height: 14px; stroke-width: 2.4; }
.pg-f { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 2px 6px; font-size: 12px; }
.pg-lbl { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-lbl.mono { font-weight: 400; color: var(--muted); }
.conf { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 0 6px; border-radius: 4px; border: 1px solid transparent; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.conf .ic { width: 13px; height: 13px; }
.conf.flag { color: var(--ink); background: var(--warn-soft); border-color: var(--warn); font-weight: 600; }
.conf.flag .ic { color: var(--warn); }
.conf[data-review] { cursor: pointer; }
.conf[data-review]:hover { text-decoration: underline; }
.conf.mine { color: var(--ink); }
.conf.reading { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.pg-flag { position: absolute; top: 6px; right: 6px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; background: var(--raise); color: var(--ink); border: 1px solid var(--field); padding: 0 6px; border-radius: 4px; }
.pg-flag .ic { width: 13px; height: 13px; }
.pg-hint {
  display: flex; align-items: center; gap: 4px; width: 100%;
  min-height: 28px; padding: 3px 6px; border-radius: 5px; border: 1px dashed var(--ai);
  background: var(--ai-soft); color: var(--ink); font-size: 12px; text-align: left;
}
.pg-hint span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-hint .lic { --lic-size: 16px; }
/* A hint and, beside it, a menu of the other places Lindley thinks of, and "no" */
.pg-hints { display: flex; gap: 4px; }
.pg-hints .pg-hint { flex: 1; min-width: 0; }
.pg-hints .pg-hint.more { flex: none; width: 28px; justify-content: center; padding: 0; }
.pg-hint.more .ic { width: 14px; height: 14px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }

/* Reader */
.reader { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
.rd-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rd-stage { overflow: auto; background: var(--stage); display: grid; place-items: center; padding: 24px; }
.rd-stage img { width: calc(var(--z) * min(560px, 100%)); max-width: none; box-shadow: var(--shadow); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px; border-top: 1px solid var(--line); }
.strip button { flex: none; width: 58px; padding: 2px; border: 2px solid transparent; border-radius: 4px; background: none; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip .pg-img img { transition: none; }
.strip span { display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); }
.strip span .ic { width: 12px; height: 12px; color: var(--warn); }

/* Side by side */
.side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }
.side-img { background: var(--stage); overflow: auto; display: grid; place-items: center; padding: 20px; }
.side-img img { max-height: 100%; max-width: 100%; box-shadow: var(--shadow); }
.side-tx { overflow: auto; padding: 16px 22px 24px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--line); }
.side-h { display: flex; align-items: center; gap: 8px; }
.side-h strong { flex: 1; }
.engine { font-size: 12px; color: var(--muted); }
.tx {
  font-family: var(--serif); font-size: 16.5px; line-height: 1.6; white-space: pre-wrap; max-width: 62ch;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); min-height: 200px;
  flex-shrink: 0; /* a long page grows the column, which scrolls, rather than spilling out */
}
.tx:focus { outline: none; border-color: var(--accent); }
.tx mark { background: var(--ai-soft); color: inherit; border-bottom: 2px dotted var(--ai); padding: 0 1px; }
.note { font-size: 13px; color: var(--muted); margin: 0; max-width: 62ch; }
.rv-state { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; max-width: 62ch; }
.rv-state.flag { background: var(--warn-soft); }
.rv-state.flag > .ic { color: var(--warn); }
.rv-state.mine { background: var(--panel); }
.rv-where { font-size: 13px; color: var(--muted); }
.rv-strip { border-top: 0; padding: 2px 0 10px; }
.fld { font-size: 13px; font-weight: 600; margin-bottom: -8px; }
.fld-in { width: 100%; padding: 8px 10px; border: 1px solid var(--field); border-radius: 6px; background: var(--raise); }
.fld-hint { display: flex; align-items: center; gap: 6px; margin-top: -6px !important; font-size: 13px; }
.fld-hint .lic { --lic-size: 16px; }
.choices { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
.choices legend { padding: 0; margin-bottom: 4px; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--field); border-radius: 8px; font-size: 13.5px; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.choice input { margin-top: 3px; accent-color: var(--accent); }
.file-list { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: 13px; }
.setup { position: absolute; inset: 0; z-index: 55; overflow: auto; background: var(--bg); display: grid; place-items: start center; padding: 32px 16px; }
.setup-card { width: min(640px, 100%); display: grid; gap: 18px; padding: 28px; border-radius: 14px; background: var(--raise); box-shadow: var(--shadow); }
.setup-brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 22px; font-weight: 600; }
.setup-brand .lic { --lic-size: 34px; }
.setup h2:focus { outline: none; }
.setup h2 { margin: 0; font-family: var(--serif); font-size: 24px; text-wrap: balance; }
.setup h3 { margin: 0 0 8px; font-size: 15px; }
.setup p { margin: 0; color: var(--muted); }
.setup section { display: grid; gap: 8px; }
.setup-folders { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.setup-folders li { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; border: 1px solid var(--line); border-radius: 8px; }
.setup-folders li .mono { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
.setup-add { display: flex; gap: 8px; flex-wrap: wrap; }
.setup-add .fld-in { flex: 1 1 240px; width: auto; }
.setup .actions { justify-content: flex-end; }
.rv-where b { color: var(--ink); font-weight: 500; }
.banner.danger { background: var(--warn-soft); border: 2px solid var(--warn); font-size: 14px; }
.banner.danger > .ic { color: var(--warn); width: 22px; height: 22px; margin-top: 1px; }

/* Settings */
.set { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.set-nav { display: flex; flex-direction: column; gap: 2px; padding: 16px 10px; border-right: 1px solid var(--line); overflow: auto; }
.set-nav button { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 10px; border: 1px solid transparent; border-radius: 6px; background: none; text-align: left; }
.set-nav button:hover { background: var(--panel); }
.set-nav button.is-active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); font-weight: 500; }
.set-nav button.is-active .ic { color: var(--accent); }
.set-pick { display: none; gap: 6px; max-width: 360px; padding-bottom: 8px; }
.set-pick .fld { margin: 0; }
.set-body { padding: 18px 24px 28px; }
.main.has-dock .set-body { padding-bottom: 96px; }
.set-sec { max-width: 740px; display: grid; gap: 12px; }
.set-sec h2 { margin: 0; font-family: var(--serif); font-size: 21px; }
.set-sec h3 { margin: 16px 0 0; font-size: 15px; }
.set-sec p { margin: 0; }
.set-p { color: var(--muted); max-width: 70ch; }
.set-sec .fld, .conn-ed .fld { margin: 0 0 -6px; }
.fld-note { margin: 0; font-size: 13px; color: var(--muted); }
.fld-note .ic { width: 14px; height: 14px; vertical-align: -2px; }
.limit-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px; }
.limit-check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.limit-check input { accent-color: var(--accent); }
.limit-in { width: 6em; }
.conn-uses .ptag { margin-left: 6px; }
.set-add { justify-self: start; }
@container (max-width: 700px) {
  .set { grid-template-columns: minmax(0, 1fr); }
  .set-nav { display: none; }
  .set-pick { display: grid; }
  .set-body { padding-inline: 14px; }
}
/* Privacy: always said in words, with an icon, never by color alone. */
.ptag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--field); font-size: 12px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.ptag .ic { width: 14px; height: 14px; }
.ptag.cloud, .ptag.server { background: var(--warn-soft); border-color: var(--warn); font-weight: 600; }
.ptag.cloud .ic, .ptag.server .ic { color: var(--warn); }
.ptag.priv { background: var(--ok-soft); border-color: var(--ok); }
.ptag.priv .ic { color: var(--ok); }
.ptag.none { color: var(--muted); }
.pwarn { display: grid; gap: 10px; padding: 14px 16px; border: 2px solid var(--warn); border-radius: 10px; background: var(--warn-soft); color: var(--ink); }
.pwarn h4 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 16px; }
.pwarn h4 .ic { width: 24px; height: 24px; color: var(--warn); stroke-width: 2; }
.pwarn ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 13.5px; }
.ack { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--warn); border-radius: 8px; background: var(--raise); font-weight: 600; cursor: pointer; }
.ack input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--accent); }
.conns { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.conn { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 12px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raise); }
.conn-main { flex: 1 1 280px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.conn-main b { font-size: 15px; }
.conn-where, .conn-uses, .conn-usage { flex-basis: 100%; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.conn-acts { display: flex; gap: 6px; }
.conn-ed { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); }
.conn-ed > h3 { margin: 0; }
.choices.two { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.choice b .ic { width: 15px; height: 15px; vertical-align: -2px; margin-right: 2px; }
.keyrow { display: flex; gap: 8px; }
.keyrow .fld-in { flex: 1; width: auto; min-width: 0; }
.actions.conn-acts { align-items: center; }
.test-res { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.test-res .ic { width: 16px; height: 16px; }
.tasks { display: grid; gap: 14px; }
.task { display: grid; gap: 6px; justify-items: start; }
.task .fld { margin: 0; }
.task .fld-in { max-width: 440px; }
.task-model { display: grid; gap: 6px; justify-items: start; width: 100%; }
.lim-grp { display: grid; gap: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
.lim-h { margin: 4px 0 0; font-size: 14px; }
.lim-sub { font-weight: 500; }
.thr-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.thr-row input[type="range"] { flex: 1 1 200px; max-width: 360px; accent-color: var(--accent); }
.thr-row .fld-in { width: 84px; }
.langs { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.langs label { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px 4px 8px; border: 1px solid var(--field); border-radius: 999px; cursor: pointer; }
.langs label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
.langs input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.kv { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13.5px; }
.kv > .ic { color: var(--ok); }
.kv-list { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13.5px; }
.safe { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.safe li { display: flex; gap: 8px; align-items: flex-start; }
.safe .ic { color: var(--ok); margin-top: 1px; }
.ai-priv { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--field); background: none; color: var(--ink); font-size: 12px; white-space: nowrap; }
.ai-priv .ic { width: 14px; height: 14px; }
.ai-priv.cloud { background: var(--warn-soft); border-color: var(--warn); font-weight: 600; }
.ai-priv.cloud .ic { color: var(--warn); }
.ai-priv.priv .ic { color: var(--ok); }
.rv-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.rv-done { display: grid; justify-items: center; gap: 10px; padding: 64px 20px; text-align: center; color: var(--muted); }
.rv-done > .ic { width: 40px; height: 40px; color: var(--ink); }
.rv-done h2 { margin: 0; font-family: var(--serif); color: var(--ink); }

/* Folder / doc cards */
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 20px; }
.dcard { display: flex; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); text-align: left; align-items: flex-start; }
.dcard:hover { border-color: var(--accent); }
.dcard .pg-img { width: 64px; flex: none; }
.dcard b { display: block; font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1.25; margin-bottom: 4px; }
.dcard small { color: var(--muted); display: flex; align-items: center; gap: 4px; }
.dcard small .ic { width: 14px; height: 14px; color: var(--ink); }
.dcard.is-drop { border-color: var(--accent); border-style: dashed; }

/* Needs AI: scans waiting for an AI, each with a button to send it */
.na-list { display: flex; flex-direction: column; gap: 24px; padding: 20px; }
.na-list h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.na-list h2 .ic, .na-list h2 .lic { width: 16px; height: 16px; }
.na-list .sub { margin-bottom: 10px; }
.na-list .docs { padding: 0; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.na-card { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); }
.na-card:hover { border-color: var(--ai); }
.na-card > .dcard { padding: 0; border: 0; background: none; }
.na-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.na-guess { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.na-cands { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13.5px; }
.na-cands li { display: flex; align-items: center; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; padding: 6px 8px; border-radius: 6px; background: var(--raise); }
.na-cands small { display: block; color: var(--muted); }
.na-to { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.conf.ai { color: var(--ink); background: var(--ai-soft); border-color: var(--ai); font-weight: 600; }
.conf .lic, .t-flag .lic { --lic-size: 14px; }

/* Duplicates: copies side by side */
.dup-list { display: flex; flex-direction: column; gap: 24px; padding: 20px; }
.dup-list h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.dup-list h2 .ic { width: 16px; height: 16px; }
.dup-list .sub { margin-bottom: 10px; }
.dup-list .docs { padding: 0; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.dup-thumbs { display: flex; gap: 4px; flex: none; }
.dcard .dup-thumbs .pg-img { width: 46px; }
/* Each copy is a column; their headers, notes, scans and details line up row by row. */
.dup-cmp { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: auto auto minmax(220px, 1fr) auto; flex: 1; min-height: 0; overflow: auto; }
.dup-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; }
.dup-bar .strip { padding: 0 0 6px; border: 0; }
.dup-bar .strip button { width: 38px; }
.main.has-dock .dup-cmp { padding-bottom: 78px; }
.dup-col { display: grid; grid-row: span 4; grid-template-rows: subgrid; min-height: 0; border-left: 1px solid var(--line); }
.dup-col:first-child { border-left: 0; }
.dup-col-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 16px; }
.dup-col-h h2 { flex: 1 1 auto; margin: 0; font-size: 15px; font-weight: 600; }
.dup-note { margin: 0; padding: 0 16px 8px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
/* The scan fits its column; zoomed in, it scrolls, and both columns scroll together. */
.dup-img { position: relative; flex: 1; min-height: 160px; overflow: hidden; background: var(--stage); }
.dup-img img { position: absolute; inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); object-fit: contain; transform: rotate(var(--r, 0deg)) scale(var(--s, 1)); }
.dup-img.zoomed { overflow: auto; }
.dup-img.zoomed img { position: static; display: block; margin: 12px auto; width: calc(var(--z) * 100% - 24px); height: auto; }
.dup-tx { flex: 1; min-height: 160px; overflow: auto; padding: 14px 18px; font-family: var(--serif); line-height: 1.6; white-space: pre-wrap; }
.dup-tx mark, .sub mark { background: var(--warn-soft); color: inherit; text-decoration: underline wavy var(--warn); text-underline-offset: 3px; }
.dup-facts { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 2px 10px; margin: 0; padding: 8px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.dup-facts dt { color: var(--muted); }
.dup-facts dd { margin: 0; overflow-wrap: anywhere; }
.dup-facts .wide { grid-column: 2 / -1; }
.pg-dup { display: flex; align-items: center; gap: 4px; padding: 0 8px 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pg-dup > span { overflow: hidden; text-overflow: ellipsis; }
.pg-dup .ic { width: 13px; height: 13px; flex: none; }
@media (max-width: 860px) {
  .dup-cmp { grid-template-columns: 1fr; grid-template-rows: none; overflow: auto; }
  .dup-col { grid-row: auto; grid-template-rows: auto auto 360px auto; border-left: 0; border-top: 1px solid var(--line); }
}

/* Search */
.results { display: grid; gap: 4px; padding: 12px 20px 24px; max-width: 900px; }
.res { display: flex; gap: 14px; padding: 10px; border: 1px solid transparent; border-radius: 8px; background: none; text-align: left; align-items: flex-start; }
.res:hover { background: var(--panel); border-color: var(--line); }
.res .pg-img { width: 56px; flex: none; }
.res b { font-weight: 600; }
.res p { margin: 4px 0 0; font-family: var(--serif); font-size: 15px; color: var(--muted); }
.res mark { background: var(--accent-soft); color: var(--ink); padding: 0 2px; border-radius: 2px; font-weight: 600; text-decoration: underline; }

/* Status bar */
.status {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 5px 12px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); background: var(--panel);
}
.status .ic { width: 14px; height: 14px; }
.status span, .status button { display: inline-flex; align-items: center; gap: 6px; }
.status button { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; font-size: 12px; }
.dot { display: inline-block; flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.dot.busy { background: var(--ai); animation: pulse 1.2s infinite; }

/* ---------- Ask Lindley ---------- */
.ai-pane {
  grid-row: 2; grid-column: 3; width: 340px;
  display: flex; flex-direction: column; min-height: 0;
  border-left: 1px solid var(--line); background: var(--raise);
}
.ai-pane.is-float {
  position: absolute; z-index: 30; width: 360px; height: 480px;
  border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow);
  resize: both; overflow: hidden; min-width: 280px; min-height: 300px;
}
.ai-h { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); }
.ai-pane.is-float .ai-h { cursor: move; background: var(--panel); }
.ai-h strong { flex: 1; font-family: var(--serif); font-size: 17px; }
.ai-h .lic { --lic-size: 26px; }
.ai-h .icon-btn { width: 28px; height: 28px; }
.ai-ctx { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface); }
.ai-ctx b { color: var(--ink); font-weight: 500; }
.ai-log { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; font-size: 13.5px; }
.msg p { margin: 0 0 6px; }
.msg p:last-child { margin: 0; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
.msg.ai { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 3px; }
.msg ul { margin: 4px 0; padding-left: 18px; display: grid; gap: 3px; }
.msg q { font-family: var(--serif); font-style: italic; }
.msg-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg-acts button { font-size: 13px; min-height: 28px; padding: 2px 10px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--raise); }
.msg-acts button:hover { border-color: var(--accent); color: var(--accent); }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: pulse 1s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
.ai-sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
.ai-sugg button { font-size: 13px; min-height: 28px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--ai); background: var(--ai-soft); color: var(--ink); text-align: left; }
.ai-form { display: flex; gap: 6px; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
.ai-form textarea { flex: 1; resize: none; padding: 7px 9px; border: 1px solid var(--field); border-radius: 8px; background: var(--surface); min-height: 38px; }
.ai-form button { align-self: flex-end; }
.ai-rail {
  grid-row: 2; grid-column: 3; width: 44px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px;
  border: 0; border-left: 1px solid var(--line); background: var(--raise); color: var(--ink);
}
.ai-rail .lic { --lic-size: 28px; }
.ai-rail span { writing-mode: vertical-rl; font-family: var(--serif); font-size: 14px; font-weight: 600; letter-spacing: .03em; }

/* ---------- Overlays ---------- */
.menu {
  position: fixed; z-index: 60; min-width: 220px; max-width: min(320px, calc(100vw - 32px));
  padding: 4px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raise); box-shadow: var(--shadow);
  display: flex; flex-direction: column; max-height: 60vh; overflow: auto;
}
.menu button { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 6px 10px; border: 0; border-radius: 5px; background: none; text-align: left; font-size: 13px; }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--accent-soft); }
.menu button[data-depth] { padding-left: calc(10px + var(--d) * 16px); }
.menu button:disabled { opacity: .45; cursor: default; }
.menu .lic { --lic-size: 18px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; width: auto; }
.menu .mh { padding: 4px 10px 2px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.menu .ic { width: 16px; height: 16px; }
.toast {
  position: fixed; z-index: 70; left: 50%; bottom: 128px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px);

  const views = { inbox: viewInbox, aside: viewAside, doc: viewDoc, folder: viewFolder, search: viewSearch, scan: viewScan, settings: viewSettings, review: () => U.nav.id ? viewReview() : viewReviewList(), needsai: () => U.nav.id && sortItem(U.nav.id) ? viewNeedsAiItem() : viewNeedsAiList(), dups: () => U.nav.id && dupEntry(U.nav.id) ? viewDup() : viewDupList() };
  const dk = dock();
  main.innerHTML = views[U.nav.t]() + dk;
  main.classList.toggle('has-dock', !!dk);
  const s = $('.scroll', main);
  if (s) s.scrollTop = sc;

}

function aiBanner(read, items, what, act, detail) {
  // An offer to send scans to the AI, saying where they'd go.
  const n = read.length + items.reduce((k, x) => k + x.pages.length, 0);
  if (!n) return '';
  const parts = [];
  if (read.length) parts.push(`${plural(read.length, 'page')} ${read.length === 1 ? 'was' : 'were'} too hard to read`);
  if (items.length) parts.push(`${plural(n - read.length, 'page')} couldn’t be sorted into documents`);
  const who = [...new Set([read.length && aiWho('vision'), items.length && aiWho('assemble')].filter(Boolean))].join(' and ');
  // Left over with an AI that runs on its own: a limit is used up, or its calls keep failing.
  const autoJob = read.length && aiAuto('vision') ? 'vision' : items.length && aiAuto('assemble') ? 'assemble' : null;
  const wait = autoJob ? autoWaitWhy(autoJob, read) :`Lindley asks you first, so nothing is sent to ${esc(who)} until you say so.`;
  return `<div class="banner ai">${lic()}<div class="b-body"><div class="b-text"><b>${what || `${plural(n, 'scan')} ${n === 1 ? 'needs' : 'need'} an AI to look at ${n === 1 ? 'it' : 'them'}.`}</b> ${detail || parts.join(', and ') + '.'} ${wait}</div><span class="b-acts"><button class="btn ai" data-act="${act}">${lic()} Ask the AI</button><button class="btn ghost" data-nav="needsai">See what’s waiting</button></span></div></div>`;
}

// The transcription panel is shared by the Scan and text tab and the review queue.
function txPanel(s, o) {

    ? `<div class="rv-state flag">${lic()}<div><b>This scan needs an AI to look at it.</b> Tesseract read it with only ${s.conf}% confidence, so this text is a rough guess.${s.failed ? ` The AI was asked to read it and ${esc(aiWho('vision'))} ${esc(s.failed)}, so it waits for you to try again.` : ''} Once the AI has read it, check its text here. If you check it yourself first, the AI isn’t needed.</div></div>`
    : flag
    ? `<div class="rv-state flag">${icon('flag')}<div><b>Needs your review.</b> Lindley read this page with ${s.conf}% confidence${unsure ? ` and wasn't sure of ${plural(unsure, 'word')}` : ''}. Compare the text with the scan and fix anything that's wrong.</div></div>`

  return `

}

const scopeName = id => id === 'all' ? 'All pages' : id === 'inbox' ? 'Inbox' : D.docs[id]?.name || '';

function viewNeedsAiList() {

function answer(q) {
  const ql = q.toLowerCase();
  const d = curDoc();
  const pageId = curScan();
  const m = q.match(/mention(?:ing|s)?\s+(.+?)[?.]*$/i);
  if (m || /\bfind\b/.test(ql)) {

    if (!res.length && words.length > 1) res = searchScans(words[words.length - 1]);
    if (!res.length) { pushMsg('ai', `<p>I couldn't find “${esc(term)}” on any page. Handwriting is sometimes read loosely, so try a surname on its own.</p>`); return; }

    res.forEach(r => { const k = r.l.where === 'doc' ? r.l.doc.id : r.s.id; if (!byDoc.has(k)) byDoc.set(k, r); });
    const top = [...byDoc.values()].slice(0, 6);
    pushMsg('ai', `<p>I found “${esc(term)}” on ${plural(res.length, 'page')}, in ${plural(byDoc.size, 'place')}. The first few:</p><ul>${top.map(r => `<li>${whereLabel(r)}</li>`).join('')}</ul>`,
      [...top.slice(0, 4).map(r => ({ label: 'Open ' + (r.l.where === 'doc' ? shortName(r.l.doc.name) : r.s.file), fn: () => openScan(r.s.id) })),

    return;
  }
  if (/place|belong|sort|which inbox/.test(ql)) {
    const h = D.inbox.filter(id => D.scans[id].hint);
    if (!h.length) { pushMsg('ai', '<p>I can\'t place any more Inbox scans with confidence right now. As new scans arrive I\'ll check them against your documents.</p>'); return; }
    pushMsg('ai', `<p>I think ${plural(h.length, 'scan')} in the Inbox belong to documents in progress:</p><ul>${h.map(id => `<li><span class="mono">${D.scans[id].file}</span> → ${esc(D.docs[D.scans[id].hint].name)}</li>`).join('')}</ul><p>The other scans don't match anything yet. Some are receipts and blank pages that could be set aside.</p>`,
      [{ label: `Add all ${h.length}`, fn: () => { const g = {}; h.forEach(id => (g[D.scans[id].hint] ||= []).push(id)); commit(`Added ${plural(h.length, 'scan')} to their documents.`, () => { Object.entries(g).forEach(([doc, ids]) => ids.forEach(id => { detach(id); D.docs[doc].pages.push(id); D.scans[id].hint = null; })); }); } },
        { label: 'Show them in the Inbox', fn: () => { go({ t: 'inbox' }, { sort: 'match' }); } }]);
    return;
  }
  if (/review|unsure|not sure|check/.test(ql)) {
    const q = reviewQueue();
    if (!q.length) { pushMsg('ai', '<p>Nothing needs your review right now. Every page I\'ve read is either confident or checked by you.</p>'); return; }
    const by = new Map();
    q.forEach(id => { const l = locate(id); const k = l.where === 'doc' ? l.doc.name : 'Inbox'; by.set(k, (by.get(k) || 0) + 1); });
    pushMsg('ai', `<p>I'm not confident I read ${plural(q.length, 'page')} correctly:</p><ul>${[...by].map(([k, n]) => `<li>${esc(k)}: ${plural(n, 'page')}</li>`).join('')}</ul><p>Most are handwriting with a word or two I couldn't make out. Each check takes about a minute.</p>`,
      [{ label: 'Start reviewing', fn: () => go({ t: 'review' }) }]);
    return;
  }
  if (pageId && /this page|page say|say\b|read/.test(ql)) {
    const s = D.scans[pageId];
    const t = s.text.replace(/[{}]/g, '').replace(/\n+/g, ' ');
    pushMsg('ai', `<p>This page reads:</p><p><q>${esc(t.length > 320 ? t.slice(0, 320) + '…' : t)}</q></p>${needsReview(s) ? '<p>I wasn\'t sure of the highlighted words, so please check them against the scan.</p>' : ''}`);
    return;
  }
  if (U.nav.t === 'folder' && /folder/.test(ql)) {
    pushMsg('ai', `<p>${esc(D.folders[U.nav.id].name)} holds ${esc(folderSummary(folderStats(U.nav.id)))}.</p><p>Open any document and I can summarize it or check it for missing pages.</p>`);
    return;
  }
  if (!d) {
    pushMsg('ai', '<p>Open a document and I can summarize it, check for missing pages, or explain its date. From anywhere, I can find every page that mentions a person or place.</p>');
    return;
  }
  if (/order/.test(ql)) {
    if (d.note) pushMsg('ai', `<p>${esc(d.note.text)} The text agrees: the paragraph that ends page 2 continues at the top of page 3.</p>`, [{ label: d.note.fix, fn: fixOrder }]);
    else pushMsg('ai', '<p>The order looks right to me. Each page continues the sentence or entry from the page before.</p>');
    return;
  }
  if (/missing|complete|finish/.test(ql)) { pushMsg('ai', `<p>${esc(d.missing || 'I can\'t tell yet. I\'ll know more once all the pages have been read.')}</p>`); return; }
  if (/date|when|dated|year/.test(ql)) { pushMsg('ai', `<p>${esc(d.dateWhy || 'I haven\'t found a date on these pages yet.')}</p>`); return; }

}

    noGroup: () => { const g = D.groups.find(x => x.id === a.dataset.id); if (g) dismissHint(g.pages[0]); },
    asideHint: () => setAside([a.dataset.id]),
    asideAll: () => setAside(D.inbox.filter(id => D.scans[id].asideWhy)),
    showAside: () => showScans(D.inbox.filter(id => D.scans[id].asideWhy)),
    moveMenu: () => menuAt(moveItems(ids)),
    pageMore: () => menuAt(pageMenuItems(ids, true)),
    addScans: () => $('#file-in').click(),
    modalAddScans: () => { const mode = $('input[name="add-mode"]:checked', modal)?.value || 'copy'; const files = pendingFiles; modal.hidden = true; syncScrim(); if (U.nav.t !== 'inbox') go({ t: 'inbox' }); addScans(files, mode); },
    saveSettings: () => commitSettings(),
    discardSettings,
    modalDiscardGo: () => { modal.hidden = true; syncScrim(); U.sdraft = null; U.cedit = null; go(...pendingGo); },
    modalSaveGo: () => { modal.hidden = true; syncScrim(); if (commitSettings(true)) go(...pendingGo); },
    backHome: () => go({ t: locate(U.nav.id)?.where === 'aside' ? 'aside' : 'inbox' }),
    startReview: () => go({ t: 'review', id: 'all' }),
    askReview: () => ask('Which pages need my review?'),
    askFolder: () => ask('What is in this folder?'),
    askScan: () => ask('What does this page say?'),
    askDoc: () => { const sel = listIds().filter(id => U.sel.has(id)); if (sel.length) askAbout(sel); else ask('What is this document about?'); },
    folderMenu: () => menuAt(folderMenuItems(d.id)),
    newSubfolder: () => newFolder(U.nav.id),
    reviewDoc: () => go({ t: 'review', id: d.id }),
    modalReview: () => { const id = a.closest('.modal').querySelector('[data-act="modalExport"]').dataset.id; modal.hidden = true; syncScrim(); go({ t: 'review', id }); },
    confirmTx: () => { const id = curScan(); if (id) confirmPage(id); },
    nextReview: () => { const q = reviewQueue(d.id); const i = d.pages.indexOf(q.find(x => x !== d.pages[U.cur])); if (i >= 0) { U.cur = i; render(); } },
    askInbox: () => ask('Which inbox scans can you place?'),
    askSearch: () => ask(`Find every page mentioning ${U.q}`),
    selAll: () => { if (U.sel.size === d.pages.length) U.sel.clear(); else d.pages.forEach(p => U.sel.add(p)); renderMain(); },
    sortMatch: () => { U.sort = 'match'; renderMain(); },
    export: () => confirmExport(d.id),
    modalExport: () => { closeModal(); exportDoc(a.dataset.id); },
    modalClose: closeModal,
    reopen: () => reopen(d.id),
    notReady: () => commit('Okay. Lindley will leave this document in progress.', () => { d.ready = false; }),
    fixOrder,
    dismissNote: () => commit('Kept the current page order.', () => { d.note = null; }),
    addMatches: () => { const h = D.inbox.filter(id => D.scans[id].hint === d.id); moveTo(h, d.id); },
    showMatches: () => { const h = D.inbox.filter(id => D.scans[id].hint === d.id); go({ t: 'inbox' }, { sort: 'match' }); h.forEach(id => U.sel.add(id)); render(); },
    saveTx: () => { const id = curScan(); if (id) confirmPage(id, $('#tx').innerText.replace(/\n{3,}/g, '\n\n').trim()); },
    prev: () => { U.cur = Math.max(0, U.cur - 1); render(); },
    next: () => { U.cur = Math.min(listIds().length - 1, U.cur + 1); render(); },
    zin: () => { U.zoom = Math.min(3, +(U.zoom + .25).toFixed(2)); renderMain(); },
    zout: () => { U.zoom = Math.max(.5, +(U.zoom - .25).toFixed(2)); renderMain(); },
    zfit: () => { U.zoom = 1; renderMain(); },
    newFolder: () => newFolder(null),
    keepCopy: () => keepCopy(a.dataset.dupset, a.dataset.id),
    keepDoc: () => keepDoc(a.dataset.key, a.dataset.id),
    notDup: () => notDup(U.nav.id),
    aiAll: () => sendToAi(aiReadQueue(), sortQueue(), 'Sent everything waiting to the AI.'),
    aiInbox: () => sendToAi(aiReadQueue().filter(id => D.inbox.includes(id)), sortQueue(), 'Sent the Inbox scans to the AI.'),
    aiDoc: () => sendToAi(docAiRead(d), [], `Sent ${plural(docAiRead(d).length, 'page')} to the AI to read.`),
    aiScan: () => sendToAi([U.nav.id], [], 'Sent the scan to the AI to read.'),
    aiReadGroup: () => { const ids = a.dataset.id === 'inbox' ? aiReadQueue().filter(id => D.inbox.includes(id)) : docAiRead(D.docs[a.dataset.id]); sendToAi(ids, [], `Sent ${plural(ids.length, 'page')} to the AI to read.`); },
    aiItem: () => { const x = sortItem(a.dataset.id || U.nav.id); if (x) sendToAi([], [x], `Sent ${plural(x.pages.length, 'page')} to the AI to sort.`); },
    aiMine: () => newDocDialog(sortItem(U.nav.id).pages),
    aiPrev: () => { const q = sortQueue(), k = q.findIndex(x => x.id === U.nav.id); if (q[k - 1]) go({ t: 'needsai', id: q[k - 1].id }); },
    aiNext: () => { const q = sortQueue(), k = q.findIndex(x => x.id === U.nav.id); if (q[k + 1]) go({ t: 'needsai', id: q[k + 1].id }); },
    aiSettings: () => go({ t: 'settings', id: 'ai' }),
    dupPrev: () => stepDup(-1),
    dupNext: () => stepDup(1),
    undo,
  };
  A[a.dataset.act]?.();
});

main.addEventListener('contextmenu', e => {
  const pg = e.target.closest('.pg');
  if (!pg || curDoc()?.status === 'complete') return;
  e.preventDefault();
  const id = pg.dataset.pg;
  // The keyboard menu key reports no pointer position, so open the menu at the page instead.
  const r = pg.getBoundingClientRect();
  const x = e.clientX || r.left + 20, y = e.clientY || r.top + 20;
  if (!U.sel.has(id)) { U.sel.clear(); U.sel.add(id); renderMain(); }
  openMenu(pageMenuItems(targets()), x, y);
});
main.addEventListener('change', e => {
  const t = e.target;
  const d = curDoc();
  if (t.id === 'doc-title' && d) { const v = t.value.trim(); if (v) setField(d.id, 'name', v, 'Renamed the document.'); else t.value = d.name; }
  else if (t.id === 'folder-title') { const f = D.folders[U.nav.id]; const v = t.value.trim(); if (v && v !== f.name) commit('Renamed the folder.', () => { f.name = v; }); }
  else if (t.id === 'sort') { U.sort = t.value; renderMain(); }
  else if (t.id === 'set-sec') { go({ t: 'settings', id: t.value }); $('#set-sec')?.focus(); }
});
// Settings and setup fields write straight into their draft.
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset?.bind || t.type === 'radio' || t.type === 'checkbox' || t.tagName === 'SELECT') return;
  if (t.dataset.bind === 'd.threshold' && !(+t.value >= 50 && +t.value <= 99)) return;
  if (t.dataset.bind === 'd.aiBelow' && !(+t.value >= 20 && +t.value <= 95)) return;
  bindSet(t); afterInput(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset?.bind) return;
  if (t.dataset.bind === 'd.threshold') t.value = Math.max(50, Math.min(99, Math.round(+t.value || 90)));
  if (t.dataset.bind === 'd.aiBelow') t.value = Math.max(20, Math.min(95, Math.round(+t.value || 70)));
  bindSet(t);
  if ('rerender' in t.dataset) { rerender(ctxOf(t)); if (ctxOf(t) === 'st') refreshDock(); }
  else afterInput(t);
});
main.addEventListener('input', e => {
  if (e.target.id === 'thumb') { U.thumb = +e.target.value; $('#grid')?.style.setProperty('--thumb', U.thumb + 'px'); }
});
main.addEventListener('keydown', e => {
  if ((e.target.id === 'doc-title' || e.target.id === 'folder-title') && e.key === 'Enter') e.target.blur();
  // Arrow keys move between tabs, as in any tab list.
  if (e.target.matches('.tab') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const tabs = $$('.tab', main);
    const next = tabs[(tabs.indexOf(e.target) + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    next.click();
    $(`.tab[data-view="${next.dataset.view}"]`, main)?.focus();
  }
});

/* Drag and drop: reorder within a document, or drop onto the tree */
let drag = null;
main.addEventListener('dragstart', e => {
  const pg = e.target.closest('.pg');
  if (!pg) return;
  const id = pg.dataset.pg;
  if (!U.sel.has(id)) { U.sel.clear(); U.sel.add(id); $$('.pg', main).forEach(p => p.classList.toggle('is-sel', p.dataset.pg === id)); }
  drag = listIds().filter(x => U.sel.has(x));
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  requestAnimationFrame(() => drag?.forEach(x => $(`[data-pg="${x}"]`, main)?.classList.add('is-dragging')));
});
main.addEventListener('dragend', () => { drag = null; $$('.is-dragging,.drop-before,.drop-after').forEach(el => el.classList.remove('is-dragging', 'drop-before', 'drop-after')); $$('.is-drop').forEach(el => el.classList.remove('is-drop')); });
main.addEventListener('dragover', e => {
  const pg = e.target.closest('.pg');
  if (!drag || !pg || U.nav.t !== 'doc' || curDoc().status === 'complete') return;
  e.preventDefault();
  const r = pg.getBoundingClientRect();
  const after = e.clientX > r.left + r.width / 2;
  $$('.drop-before,.drop-after', main).forEach(el => el.classList.remove('drop-before', 'drop-after'));
  pg.classList.add(after ? 'drop-after' : 'drop-before');
});
main.addEventListener('drop', e => {
  const pg = e.target.closest('.pg');
  if (!drag || !pg) return;
  e.preventDefault();
  const r = pg.getBoundingClientRect();
  const ids = drag; drag = null;
  reorderDrop(ids, pg.dataset.pg, e.clientX > r.left + r.width / 2);
});
tree.addEventListener('dragover', e => {
  const tg = e.target.closest('[data-drop]');
  $$('.is-drop', tree).forEach(el => el !== tg && el.classList.remove('is-drop'));
  if (!drag || !tg) return;
  const [k, id] = tg.dataset.drop.split(':');
  if ((k === 'doc' && U.nav.t === 'doc' && U.nav.id === id) || k === U.nav.t && k !== 'doc') return;
  e.preventDefault();
  tg.classList.add('is-drop');
});
tree.addEventListener('dragleave', e => { e.target.closest?.('[data-drop]')?.classList.remove('is-drop'); });
tree.addEventListener('drop', e => {
  const tg = e.target.closest('[data-drop]');
  if (!drag || !tg) return;
  e.preventDefault();
  const ids = drag; drag = null;
  const [k, id] = tg.dataset.drop.split(':');
  if (k === 'doc') moveTo(ids, id); else if (k === 'inbox') toInbox(ids); else setAside(ids);
});

/* Documents: drag onto a folder to file them, or onto In progress / Completed to take them out */
let dragDoc = null;
const clearDocDrop = () => $$('[data-folderdrop].is-drop, [data-unfile].is-drop').forEach(el => el.classList.remove('is-drop'));
document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('[data-dragdoc]');
  if (!el) return;
  dragDoc = el.dataset.dragdoc;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragDoc);
});
document.addEventListener('dragover', e => {
  if (!dragDoc) return;
  const tg = e.target.closest?.('[data-folderdrop], [data-unfile]');
  clearDocDrop();
  if (!tg) return;
  e.preventDefault();
  tg.classList.add('is-drop');
});
document.addEventListener('drop', e => {
  if (!dragDoc) return;
  const tg = e.target.closest?.('[data-folderdrop], [data-unfile]');
  const id = dragDoc;
  dragDoc = null; clearDocDrop();
  if (!tg) return;
  e.preventDefault();
  fileDoc(id, tg.dataset.folderdrop || null);
});
document.addEventListener('dragend', () => { dragDoc = null; clearDocDrop(); });

/* Dragging the dock by its grip */
main.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-grip]');
  if (!g || narrow()) return;
  e.preventDefault();
  const m = main.getBoundingClientRect(), r = $('.dock', main).getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  g.setPointerCapture(e.pointerId);
  $('.dock', main).classList.add('dragging');
  const mv = ev => moveDockTo(ev.clientX - m.left - ox, ev.clientY - m.top - oy);
  const up = () => { g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); $('.dock', main)?.classList.remove('dragging'); if (U.dockPos) saveDockPos(); };
  g.addEventListener('pointermove', mv); g.addEventListener('pointerup', up);
});
main.addEventListener('dblclick', e => { if (e.target.closest('[data-grip]')) resetDock(); });

/* Scans dropped in from the computer go to the Inbox */
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); main.classList.add('file-drop'); });
document.addEventListener('dragleave', e => { if (hasFiles(e) && !e.relatedTarget) main.classList.remove('file-drop'); });
document.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  main.classList.remove('file-drop');
  if (U.nav.t !== 'inbox') go({ t: 'inbox' });
  addScansDialog(e.dataTransfer.files);
});
$('#file-in').addEventListener('change', e => { addScansDialog(e.target.files); e.target.value = ''; });

/* Keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenu(true); if (!modal.hidden) closeModal(); app.classList.remove('show-tree', 'show-ai'); syncScrim(); }
  if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Home' || e.key === 'End')) {
    e.preventDefault();
    const items = $$('button:not(:disabled)', menu);
    const i = items.indexOf(document.activeElement);
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items[j]?.focus();
    return;
  }
  // The grip moves the dock with the arrow keys; Home puts it back.
  if (e.target.matches?.('[data-grip]') && /^(Arrow(Up|Down|Left|Right)|Home)$/.test(e.key)) {
    e.preventDefault();
    if (e.key === 'Home') { resetDock(); return; }
    const m = main.getBoundingClientRect(), r = $('.dock', main).getBoundingClientRect();
    const step = e.shiftKey ? 96 : 24;
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0, dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    moveDockTo(r.left - m.left + dx, r.top - m.top + dy);
    saveDockPos();
    return;
  }
  if (e.key === 'Enter' && /^(su|st)-path$/.test(e.target.id)) { e.preventDefault(); foldAct(ctxOf(e.target), 'add'); return; }
  if (!setupEl.hidden) {
    if (e.key === 'Escape' && !setupFirst) { closeSetup(); return; }
    if (e.key === 'Tab') {
      const f = $$('button, input, select', setupEl).filter(x => !x.disabled && (x.type !== 'radio' || x.checked));
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  // Arrow keys move along the dock, as in any toolbar.
  if (e.target.closest?.('.dock') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    const items = $$('.dock button:not(:disabled)', main);
    const i = items.indexOf(e.target.closest('button'));
    items[(i + (e.key === 'ArrowRight' ? 1 : -1) + items.length) % items.length]?.focus();
    return;
  }
  if (e.target.id === 'nd-name' && e.key === 'Enter') { e.preventDefault(); $('[data-act="modalNewDoc"]', modal)?.click(); return; }
  // Keep Tab inside the open dialog.
  if (!modal.hidden && e.key === 'Tab') {
    const f = $$('button:not(:disabled), input, select', modal).filter(x => x.type !== 'radio' || x.checked);
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  const typing = e.target.closest('input, textarea, select, [contenteditable="true"]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  // Duplicates: ← and → move between the pages of a document scanned twice, else between duplicates.
  if (!typing && !e.target.matches('.tab') && U.nav.t === 'dups' && U.nav.id && dupEntry(U.nav.id) && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const en = dupEntry(U.nav.id), dir = e.key === 'ArrowRight' ? 1 : -1;
    if (en.type === 'doc') { U.cur = Math.max(0, Math.min(en.sets.length - 1, U.cur + dir)); render(); } else stepDup(dir);
  }
  if (!typing && !e.target.matches('.tab') && (U.nav.t === 'doc' || U.nav.t === 'review') && curScan()) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { U.cur = Math.min(listIds().length - 1, U.cur + 1); render(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { U.cur = Math.max(0, U.cur - 1); render(); }
  }
});

/* Search */
$('#search-form').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#search-q').value.trim();
  if (!q) return;
  U.q = q; go({ t: 'search' });
});

/* AI panel controls */
$('#ai-form').addEventListener('submit', e => { e.preventDefault(); const v = $('#ai-input').value; $('#ai-input').value = ''; ask(v); });
$('#ai-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#ai-form').requestSubmit(); } });
$('#ai-pop').addEventListener('click', () => {
  if (U.ai === 'float') U.ai = 'dock';
  else {
    const r = app.getBoundingClientRect();
    U.aiPos = { x: Math.max(12, r.width - 400), y: 70 };
    U.ai = 'float';
  }
  syncAi();
});
$('#ai-close').addEventListener('click', () => {
  if (matchMedia('(max-width: 860px)').matches) { app.classList.remove('show-ai'); syncScrim(); return; }
  U.ai = 'collapsed'; syncAi();
});
rail.addEventListener('click', () => { U.ai = 'dock'; syncAi(); });
$('#ai-toggle').addEventListener('click', () => { app.classList.toggle('show-ai'); app.classList.remove('show-tree'); if (U.ai === 'collapsed') { U.ai = 'dock'; syncAi(); } syncScrim(); });
$('#tree-toggle').addEventListener('click', () => { app.classList.toggle('show-tree'); app.classList.remove('show-ai'); syncScrim(); });
scrim.addEventListener('click', () => { if (!modal.hidden) closeModal(); app.classList.remove('show-tree', 'show-ai'); syncScrim(); });

/* Dragging the floating AI window by its header */
$('#ai-h').addEventListener('pointerdown', e => {
  if (U.ai !== 'float' || e.target.closest('button') || matchMedia('(max-width: 860px)').matches) return;
  const ar = app.getBoundingClientRect(), r = ai.getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  $('#ai-h').setPointerCapture(e.pointerId);
  const mv = ev => {
    U.aiPos.x = Math.max(0, Math.min(ev.clientX - ar.left - ox, ar.width - r.width));
    U.aiPos.y = Math.max(0, Math.min(ev.clientY - ar.top - oy, ar.height - 60));
    ai.style.left = U.aiPos.x + 'px'; ai.style.top = U.aiPos.y + 'px';
  };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
});

/* Theme */
function effectiveTheme() { return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function syncThemeBtn() { $('#theme-btn').innerHTML = icon(effectiveTheme() === 'dark' ? 'sun' : 'moon'); }
$('#theme-btn').addEventListener('click', () => {
  const t = effectiveTheme() === 'dark' ? 'light' : 'dark';
  SETUP.theme = t; if (U.sdraft) U.sdraft.theme = t;
  saveSettings(); applyTheme(t);
  if (U.nav.t === 'settings') renderMain();
});

/* Simulated background reading of new scans */
setInterval(() => {
  const id = D.inbox.find(x => D.scans[x].status === 'reading');
  if (!id) return;
  const s = D.scans[id];
  s.status = 'read';
  if (s.added) s.text = 'In the real app, this is the text Lindley read from your scan. Compare it with the image, correct anything that is wrong, then confirm it.';
  s.conf = s.engine === 'vision' ? 80 + Math.floor(Math.random() * 18) : 90 + Math.floor(Math.random() * 9);
  renderTree(); renderStatus();
  if (U.nav.t === 'inbox') renderMain();
}, 6000);

/* ================= Boot ================= */
function boot() {
  D = buildData();
  U = { nav: { t: 'doc', id: 'd1' }, view: 'grid', sel: new Set(), anchor: null, cur: 0, zoom: 1, closed: {}, ai: 'dock', aiPos: { x: 0, y: 70 }, q: '', sort: 'new', thumb: 150, dockPos: null, sdraft: null, cedit: null, sx: { path: '' } };
  // Per-viewer conveniences: where the dock was left, and whether setup has been done.
  let saved = null;
  try { U.dockPos = JSON.parse(localStorage.getItem('lindley-dock') || 'null'); saved = JSON.parse(localStorage.getItem('lindley-settings') || localStorage.getItem('lindley-setup') || 'null'); } catch (e) { /* start fresh */ }
  if (saved?.folders) Object.assign(SETUP, upgradeSaved(saved));
  $('#set-btn').innerHTML = icon('gear');
  $('#tree-toggle').innerHTML = icon('menu');
  document.documentElement.lang = 'en';
  $('#ai-toggle').innerHTML = lic();
  $('#ai-spark').innerHTML = lic();
  $('#rail-ic').innerHTML = lic();
  $('#ai-close').innerHTML = icon('close');
  $('#ai-send').innerHTML = icon('send');
  applySettings();
  aiOnItsOwn();  // an AI that runs on its own has already had what was waiting
  syncAi();
  render();
  if (!saved) openSetup(true);
  pushMsg('ai', '<p>Hello, I\'m Lindley. I can tell you about the document you have open, check whether pages are missing, or find every page that mentions a name.</p><p>When I\'m not sure I read a page correctly, I flag it for your review instead of guessing quietly. Pages like that are marked Review.</p>');
}
const fontsReady = Promise.all(['19px "Homemade Apple"', '18px "IM Fell English"', '16px "Special Elite"', '14px "IBM Plex Mono"'].map(f => document.fonts.load(f).catch(() => null)));
Promise.race([fontsReady, new Promise(r => setTimeout(r, 3000))]).then(boot);
})();
</script>
